<!-- FIRESTORE RULES: paste in Firebase console > Firestore Database > Rules > Publish
rules_version='2';
service cloud.firestore{match /databases/{d}/documents{
 function signedIn(){return request.auth!=null}
 function isAdmin(){return signedIn()&&get(/databases/$(d)/documents/users/$(request.auth.uid)).data.get('admin',false)==true}
 function verifiedDriver(){return get(/databases/$(d)/documents/users/$(request.auth.uid)).data.get('dstatus','legacy') in ['verified','legacy']}
 match /users/{u}{
  allow read:if signedIn();
  allow create:if request.auth.uid==u&&!('admin' in request.resource.data);
  allow update:if (request.auth.uid==u
      &&!request.resource.data.diff(resource.data).affectedKeys().hasAny(['admin','dreviewed'])
      &&(!request.resource.data.diff(resource.data).affectedKeys().hasAny(['dstatus'])||request.resource.data.dstatus in ['pending','none']))
     ||isAdmin();
  allow delete:if request.auth.uid==u;
  match /docs/{k}{allow read:if request.auth.uid==u||isAdmin();allow write:if request.auth.uid==u;}
 }
 match /rides/{r}{
  allow read:if signedIn();
  allow create:if request.auth.uid==request.resource.data.pax;
  allow update:if signedIn()&&(request.auth.uid==resource.data.pax||request.auth.uid==resource.data.driver||resource.data.status=='open');
  match /offers/{o}{allow read:if signedIn();allow write:if request.auth.uid==o&&verifiedDriver();}
 }
}}
To make yourself an admin (so you can approve drivers): Firebase console > Firestore > users > your document > add field  admin  (boolean) = true

<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{--acc:#c1f11d;--lime:var(--acc);--accT:#111;--accX:#c1f11d;--bg:#1b1b1b;--bgS:#1b1b1b;--bg0:#111;--card:#2b2b2c;--card2:#262627;--line:#3a3a3c;--line2:#2c2c2c;--tx:#fff;--mut:#9a9a9f;--fab:#2a2a2a;--top:#111;--btnd:#3a3a3c;--sel:#1f2f86;--selb:#3b4fd6;--pinbg:#fff;--pinfg:#111;--tgb:#1c2a05;--danger:#ff6b6b;--knob:#111;--swoff:#3a3a3c;--ph:#888;--authbg:#c1f11d;--authT:#111;--authI:#fff;--authIT:#111;--authB:#111;--authBT:#fff;--shadow:#0008;--ava:#444;--circ:#333}
body{font-family:Inter,system-ui,sans-serif;color:var(--tx);height:100vh;height:100dvh;overflow:hidden;background:var(--bg0)}
#map,#emb{position:absolute;inset:0;width:100%;height:100%}
#emb{border:0}
body:not(.light) #emb{filter:invert(.92) hue-rotate(180deg) contrast(.92) saturate(.8)}
body.emb #pin .ic,body.emb #pin .st,body.emb .mapbtn{display:none}
button,input,select{font-family:inherit}
svg[fill="#fff"]{fill:var(--tx)}svg[stroke="#fff"]{stroke:var(--tx)}
#top svg [fill]{fill:var(--tx)}#top svg [stroke]{stroke:var(--tx)}
#pin .ic svg [fill]{fill:var(--pinfg)}#pin .ic svg [stroke]{stroke:var(--pinfg)}
body.light svg.car{filter:drop-shadow(0 0 1px #777)}
.logo{font-weight:800;font-size:30px;letter-spacing:-1px}.logo span{background:#1a1a1a;color:#c1f11d;padding:0 8px;border-radius:10px;margin-left:3px}
#menu{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:500;width:52px;height:52px;border-radius:50%;background:var(--fab);border:0;color:var(--tx);font-size:24px;box-shadow:0 2px 12px var(--shadow)}
#loc{position:absolute;right:14px;z-index:500;width:52px;height:52px;border-radius:50%;background:var(--fab);border:0;box-shadow:0 2px 12px var(--shadow);display:flex;align-items:center;justify-content:center}
#top{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;z-index:500;background:var(--top);border-radius:20px;padding:6px 14px;box-shadow:0 2px 14px var(--shadow)}
#top .tr{display:flex;align-items:center;gap:12px;padding:11px 0;font-weight:600;font-size:16px}
#top .tr+.tr{border-top:1px solid var(--line2)}
#top .tr b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .tr small{color:var(--mut);font-weight:600}
svg.i{width:26px;height:26px;flex:none}
#pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:400;pointer-events:none;display:flex;flex-direction:column;align-items:center}
#pin .lbl{background:var(--top);border-radius:12px;padding:7px 12px;margin-bottom:8px;box-shadow:0 2px 10px var(--shadow);white-space:nowrap;max-width:76vw;overflow:hidden;text-overflow:ellipsis}
#pin small{display:block;color:var(--mut);font-size:12px;font-weight:600}#pin b{font-size:15px}
#pin .ic{width:44px;height:44px;border-radius:13px;background:var(--pinbg);display:flex;align-items:center;justify-content:center}
#pin .st{width:3px;height:14px;background:var(--pinbg)}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:600;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 14px calc(14px + env(safe-area-inset-bottom));max-height:78vh;overflow:visible;box-shadow:0 -4px 24px var(--shadow)}
#sheet:empty{display:none}
#sheet::before{content:"";position:absolute;top:8px;left:50%;width:46px;height:5px;margin-left:-23px;border-radius:9px;background:var(--line)}
#sheet .sc{max-height:calc(78vh - 40px);overflow:auto}
.bk{position:absolute;top:-62px;left:12px;width:50px;height:50px;border-radius:50%;background:var(--fab);border:0;color:var(--tx);font-size:24px;box-shadow:0 2px 12px var(--shadow)}
h3{font-size:21px;font-weight:800}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:10px 0}
.m{color:var(--mut);font-size:14px;margin:6px 0;line-height:1.35}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--acc);color:var(--accT);border:0;border-radius:16px;padding:17px;font:800 18px Inter,sans-serif;cursor:pointer}
.btn:active{opacity:.85}.btn.d{background:var(--btnd);color:var(--tx)}.btn.s{padding:11px 14px;width:auto;font-size:14px;border-radius:12px}

.card{background:var(--card);border-radius:16px;padding:13px;margin:9px 0}
.pr{font-weight:800;font-size:20px}
.tabs{display:flex;gap:10px;margin:2px 0 12px}
.tab{flex:1;background:var(--card);border-radius:14px;padding:8px 10px;border:2px solid transparent;color:var(--tx);text-align:left;font:600 14px Inter,sans-serif;cursor:pointer}

.where{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:0;border-radius:16px;padding:17px 16px;color:var(--tx);font:800 19px Inter,sans-serif;text-align:left;cursor:pointer}
.rec{display:flex;align-items:center;gap:14px;padding:14px 4px;font-weight:600;font-size:16px;cursor:pointer}

.sw{width:62px;height:34px;border-radius:99px;background:var(--swoff);border:0;position:relative;cursor:pointer;flex:none;transition:.15s}

.sw.on{background:var(--acc)}.sw.on::after{left:32px;background:var(--accT)}
.fr{display:flex;align-items:center;gap:12px;margin-top:6px}
.cash{width:34px;height:22px;border-radius:4px;background:#59b14e;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#0d3b0a}
.opt{width:46px;height:46px;border:0;background:none;color:var(--tx);cursor:pointer}
.opt svg{width:26px;height:26px;stroke:var(--tx);fill:none;stroke-width:2}
.of{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:var(--ava);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.of .t{flex:1;min-width:0}.of .t b{display:block}
.stars{display:flex;justify-content:center;gap:6px;margin:14px 0}.stars button{font-size:36px;background:none;border:0;cursor:pointer}
.plate{display:inline-block;background:#fff;color:#111;border-radius:6px;padding:1px 8px;font-weight:800;font-size:13px;letter-spacing:1px;border:1px solid #bbb}
.f{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:0 14px;margin:8px 0}
.f input{flex:1;border:0;background:none;padding:15px 0;font:600 16px Inter,sans-serif;outline:0;min-width:0;color:var(--tx)}
.f input::placeholder,.cin::placeholder{color:var(--ph)}
.f svg{width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cin{background:var(--card);border:0;border-radius:12px;color:var(--tx);padding:12px;font:800 18px Inter,sans-serif;width:100%;outline:0}
#srch,#set{position:fixed;inset:0;background:var(--bgS);overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 30px}

.hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hd button{background:none;border:0;color:var(--tx);font-size:28px;padding:6px 10px;cursor:pointer}
.dotb{width:12px;height:12px;border-radius:50%;background:var(--tx);flex:none}.dotl{width:12px;height:12px;border-radius:3px;background:var(--acc);flex:none}

.sec{font-weight:800;font-size:12px;color:var(--mut);letter-spacing:.9px;text-transform:uppercase;margin:22px 0 10px}

.srow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line2);font-weight:600}

const hv=(a,b)=>{const r=Math.PI/180,x=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lng-a.lng)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};

 <div class="pc" style="margin-top:8px"><input class="cin" id="c${r.id}" type="number" step=".5" min="1" placeholder="Your price"><button class="btn d s" style="width:auto;border-radius:12px;height:46px;font-size:15px" onclick="offer('${r.id}',+$('#c${r.id}').value)">Counter</button></div>`}</div>`).join(''):'<p class="m">No requests right now. They appear here instantly.</p>';
}
async function offer(id,p){
 if(!(p>0))return toast('Enter a price first.');
 const r=RQ.find(x=>x.id===id);
 await fx(R_.doc(id).collection('offers').doc(me.uid).set({driver:me.uid,name:me.name,phone:me.phone,car:me.car,plate:me.plate,price:p,eta:r?eta(r.d):null,ts:TS()}));
 SENT[id]=p;drawReqs();
}

terms:{title:'Terms & Conditions',intro:'Please read these Terms carefully. By creating an account or using {app} you agree to them.',s:[
['1. Who we are and what {app} is',['{app} is a ride-hailing platform that connects people who need a ride ("Passengers") with independent drivers ("Drivers") in Zimbabwe. {app} is operated by {company} ("we", "us", "our").','{app} is a technology platform only. We do not own vehicles, we do not employ Drivers, and we do not provide transport services ourselves. The transport service is provided by the Driver, who is an independent operator.']],
['2. Accepting these Terms',['By tapping "Create account", "Continue with Google", "Sign in" or by using the app in any way, you confirm that you have read, understood and agreed to these Terms and to our Privacy Policy.','If you do not agree, do not use {app}. We may update these Terms from time to time. If a change is important we will tell you in the app. Continuing to use {app} after a change means you accept it.']],
['3. Eligibility',['You must be at least 18 years old and legally able to enter a contract to hold an account.','Drivers must also hold a valid Zimbabwean driver\'s licence appropriate for carrying passengers, be the owner or authorised user of the vehicle, and meet every requirement of Zimbabwean law that applies to operating a passenger vehicle (including vehicle registration, a valid licence disc, roadworthiness and insurance).','You may only keep one account. You may not let anyone else use your account.']],
['4. Your account',['You must give true, accurate and current information (name, phone number, profile photo, and for Drivers the licence and vehicle details) and keep it up to date.','You are responsible for everything done through your account and for keeping your password and device secure. Tell us straight away if you think your account has been misused.','Your profile photo must be a clear photo of you. Do not use another person\'s photo, a logo or an offensive image. Your name, photo and rating are shown to the other person on a trip.']],
['5. Passenger and Driver modes',['One account can be used in Passenger mode and, once approved, in Driver mode. You can switch between modes in the app when you do not have an active trip.','You cannot switch modes during a trip.']],
['6. Driver verification',['To use Driver mode you must complete verification. We ask for your profile photo, a selfie, your driver\'s licence details and photo, your vehicle details and photo, and your vehicle registration (and insurance where we ask for it).','We review the information and may approve, reject or ask for more. We may check the information with third parties and may repeat checks at any time. Approval is not a guarantee of work, and does not mean we endorse the Driver.','You must tell us at once if your licence is suspended or expires, your vehicle becomes unroadworthy or uninsured, or anything else changes. Providing false or altered documents will lead to permanent removal and may be reported to the police.']],
['6A. Verified badge',['A "Verified" badge means we have reviewed the documents submitted at the time of approval. It is not a promise about a Driver\'s conduct or the safety of a trip.']],
['7. Requesting and accepting a ride',['A Passenger enters a pickup point and destination and proposes a fare. Drivers who are online may accept the fare or counter with a different fare. The Passenger chooses whether to accept an offer. Once the Passenger accepts, the trip is agreed between the Passenger and that Driver.','Fares are agreed between the Passenger and Driver. Suggested fares shown in the app are estimates only, based on distance, and are not binding. Route and arrival times are estimates and can change with traffic and road conditions.','If you set "Auto-accept", the app will accept the lowest offer at or below the fare you set. You are responsible for any fare you set.']],
['8. Payment',['Unless the app clearly says otherwise, payment is made in cash directly to the Driver at the end of the trip, in the amount agreed in the app. {app} does not currently collect fares and is not a party to the payment.','Passengers must pay the agreed fare. Drivers must not ask for more than the agreed fare unless the Passenger freely agrees to a change (for example a longer route requested by the Passenger or extra waiting time).','If we later offer card or mobile-money payments, additional payment terms will be shown before you use them.']],
['9. Cancellations',['Passengers and Drivers may cancel a request or an accepted trip. When you cancel an accepted trip you will be asked for a reason. Repeated or abusive cancellations (for example cancelling after a Driver has already driven to the pickup point, or a Driver repeatedly cancelling accepted trips) may lead to warnings, limits on your account or suspension.','We may in future introduce cancellation fees. If we do, we will show them to you before you request a ride.']],
['10. Conduct and safety',['Everyone using {app} must treat others with respect. You must not:','• harass, threaten, discriminate against, assault or endanger anyone;','• carry out or encourage anything illegal, including carrying illegal goods or drugs;','• drive or ride while under the influence of alcohol or drugs;','• exceed the vehicle\'s legal passenger limit or drive in an unsafe way;','• use the app to stalk, track or contact a person for any purpose other than the trip;','• record or share other people\'s personal information without a lawful reason;','• damage a vehicle or leave a vehicle in a dirty or unsafe condition;','• manipulate ratings, create fake accounts, or misuse the app, its code or its data.','Drivers must obey all traffic laws and keep their vehicle roadworthy, clean and insured. Passengers must wear seat belts where fitted.','If you are in danger, call the emergency services first. Contact numbers are in the app under Safety.']],
['11. Ratings and reviews',['After a trip, Passengers and Drivers may rate each other from 1 to 5 stars and may leave a comment. Ratings and comments must be honest, relevant and respectful. They may be shown to other users and may be used to decide whether an account is allowed to continue.','We may remove ratings or comments that are abusive, false or break these Terms.']],
['12. Photos and content you upload',['You keep ownership of the photos and information you upload, but you give us a non-exclusive, worldwide, royalty-free licence to store, process and show them to other users for the purpose of operating {app} (for example showing your photo on a ride request or driver offer). This licence ends when you delete the content or your account, except for copies we must keep by law or for legitimate safety reasons.','You promise you have the right to upload what you upload.']],
['13. Lost property and incidents',['If you leave something in a vehicle, contact the Driver through the app. We cannot guarantee that items will be returned.','If something goes wrong on a trip, please report it to us as soon as possible using the Help and support section, and to the police where appropriate.']],
['14. Location and communications',['{app} needs your device location to work. Passengers share their pickup point; Drivers share live location while online and during a trip. See the Privacy Policy for details.','By using {app} you agree that we, and the other person on your trip, may contact you by phone call or in-app messages about the trip.']],
['15. Suspension and ending your account',['We may warn, limit, suspend or close your account if you break these Terms, if we believe the safety of others is at risk, if we are required to by law, or if we reasonably believe the account is being used fraudulently.','You may stop using {app} at any time and delete your account in Settings > Privacy & data. Some information may be kept for a limited period where the law or our legitimate interests require (see the Privacy Policy).']],
['16. Our responsibility',['We work to keep {app} available and accurate, but we provide it "as is" and "as available". We do not promise that it will always be uninterrupted, error-free or that a driver will always be available.','Because the transport is provided by independent Drivers, we are not responsible for the actions, conduct or vehicles of Drivers or Passengers. To the fullest extent allowed by law, we are not liable for indirect or consequential loss, loss of profit, or loss arising from your use of or inability to use {app}.','Nothing in these Terms limits any liability that cannot be limited by law, including the rights you have under the Consumer Protection Act of Zimbabwe.']],
['17. Your responsibility',['You are responsible for your own conduct and for any loss or damage you cause. You agree to compensate us for loss, claims or costs caused by your breach of these Terms or of the law, to the extent the law allows.','Drivers are responsible for their own taxes, licences, permits, insurance and any other legal obligations that apply to the transport they provide.']],
['18. Intellectual property',['The {app} name, logo, design, software and other content (except your own content) belong to us or our licensors. You may not copy, modify, reverse-engineer or resell any part of {app}.']],
['19. Third-party services',['{app} uses services provided by others, including Google Maps, Google Places, Google Sign-In and Google Firebase. Their terms and privacy policies also apply when you use those features.']],
['20. Complaints and disputes',['If you have a complaint, contact us first at {email}. We will try to resolve it quickly and fairly.','These Terms are governed by the laws of Zimbabwe. If a dispute cannot be resolved informally, it will be decided by the competent courts of Zimbabwe.']],
['21. General',['If any part of these Terms is found to be unenforceable, the rest remains in force. If we do not enforce a right straight away, that does not mean we have given it up. You may not transfer your rights under these Terms to anyone else. These Terms, together with the Privacy Policy, are the full agreement between you and us about {app}.']],

privacy:{title:'Privacy Policy',intro:'This Privacy Policy explains what personal information {app} collects, why we collect it, how we use and protect it, and the choices and rights you have. We handle personal information in line with Zimbabwe\'s Cyber and Data Protection Act [Chapter 12:07] and other applicable law.',s:[
['1. Who is responsible for your information',['{company} ("we", "us") is the data controller for personal information processed through {app}.','Contact for privacy questions and requests: {email}.']],
['2. Information we collect',['Information you give us:','• Account details: name, phone number, email address, password (stored by our sign-in provider in hashed form, we cannot read it), and the sign-in method you use (email or Google).','• Profile: your profile photo (and a smaller copy used on ride requests and offers).','• Driver verification (Drivers only): selfie, driver\'s licence number, licence expiry date and licence photo(s), vehicle make, model, colour, year, number plate, a photo of the vehicle, and vehicle registration (and, where requested, insurance) documents.','• Ride information: the fare you propose, notes to your driver, ratings and comments you give or receive, and your messages to support.','Information collected when you use the app:','• Location: your device location. Passengers share a pickup point when requesting a ride. Drivers share live location while online and during a trip. We do not track your location when the app is closed.','• Trip data: pickup and destination addresses and coordinates, distance, status changes (requested, accepted, arrived, started, completed, cancelled), time stamps and the reason for any cancellation.','• Device and technical data: browser type, language, theme and preference settings (stored on your device), and error information.','Information from others:','• The other person on your trip (for example a rating or comment) and our sign-in provider (for example your name and email from your Google account if you choose Google Sign-In).']],
['3. How we use your information',['We use your information to:','• create and manage your account and sign you in;','• match Passengers with Drivers, show requests, offers and the trip on the map, and let you call each other;','• show your name, profile photo, rating and (for Drivers) vehicle and number plate to the other person on a trip so you can recognise each other;','• verify Drivers and keep the platform safe, prevent fraud and misuse, and investigate complaints and incidents;','• calculate and show estimated routes, distances and fares;','• calculate and display ratings;','• provide help and support and send service messages;','• improve, maintain and secure {app};','• comply with the law and respond to lawful requests from authorities.','We do not sell your personal information. We do not use your photos or documents for advertising.']],
['4. Legal bases (why we are allowed to use it)',['We process personal information because it is necessary to provide the service you asked for (contract), because you have given consent (for example for location access, camera or photo access, and notifications), because we have legitimate interests in safety, security and fraud prevention, and because we must meet legal obligations.','Where we rely on consent you can withdraw it at any time (for example by turning off location in your device settings, or deleting your account). Withdrawing consent may mean some parts of {app} stop working.']],
['5. Who we share information with',['Other users on a trip. When a trip is agreed, the Passenger and Driver can see each other\'s name, photo, rating, phone number (to call), pickup and destination, and live location during the trip. Drivers also see a Passenger\'s name, photo, rating, pickup and destination on ride requests before accepting. Passengers see a Driver\'s name, photo, rating, vehicle, number plate, verified status and estimated arrival time on offers.','Service providers who help us run {app}, who may only use the data for our purposes:','• Google Firebase (Authentication and Cloud Firestore) to store accounts, profiles, rides and verification documents;','• Google Maps Platform (Maps, Places, Routes, Geocoding) to show maps, search places and calculate routes;','• Google Sign-In if you choose to sign in with Google;','• OpenStreetMap Nominatim as a backup address search if Google services are unavailable.','Authorities and legal reasons. We may disclose information to the police, courts or regulators when the law requires it, or to protect the safety and rights of people or the platform.','Business changes. If {app} is sold or merged, your information may transfer to the new owner, who must continue to protect it under this Policy.','Driver verification documents are only visible to you and to authorised {app} reviewers. They are not shown to Passengers.']],
['6. Where your information is stored',['Our service providers (such as Google) may store and process information on servers outside Zimbabwe. When information is transferred abroad we take reasonable steps to make sure it is protected to a standard comparable to Zimbabwean law, for example through our providers\' security commitments and contractual safeguards.']],
['7. How long we keep information',['• Account and profile: for as long as you have an account.','• Trip records and ratings: kept for a reasonable period for safety, dispute resolution, accounting and legal needs, then deleted or anonymised.','• Driver verification documents: kept while you are an active Driver and for a reasonable period afterwards where needed for safety or legal reasons, then deleted.','• Live location: used during a trip; the last known position is kept with the trip record.','When you delete your account we delete your profile, photo and verification documents. We may keep limited trip records (for example the trip and its rating) where we need them for safety, legal or dispute reasons, in a form that is no longer linked to your profile where possible.']],
['8. Security',['We use industry-standard protections including encrypted connections (HTTPS), access rules so that users can only reach what they are allowed to, and restricted access to verification documents. No system is perfectly secure. Keep your password private, use a strong password, and sign out on shared devices. Tell us immediately if you think your account has been accessed without permission.']],
['9. Your rights',['Under the Cyber and Data Protection Act and other applicable law you may have the right to:','• be told how your information is used (this Policy);','• access the information we hold about you;','• correct information that is wrong or incomplete;','• delete your information, subject to legal limits;','• object to or restrict certain uses;','• withdraw consent;','• complain to the Cyber and Data Protection authority (the Zimbabwe Posts and Telecommunications Regulatory Authority, POTRAZ, acts as the data protection authority) if you think your rights have been breached.','In the app you can: edit your profile and photo (Settings > Personal info), download a copy of your data (Settings > Privacy & data), and delete your account (Settings > Privacy & data). You can also email {email}. We may need to confirm your identity before acting on a request.']],
['10. Photos, camera and permissions',['The app asks for permission before using your camera, photos, location or notifications. You can change these permissions in your device or browser settings at any time. If you refuse camera or photo access you will not be able to upload a profile photo or complete Driver verification.']],
['11. Local storage and similar technologies',['{app} stores small amounts of information on your device (for example your chosen theme, preferences, recent places and a login session) so that it works properly. We do not use advertising cookies. If you clear your browser data these settings will reset.']],
['12. Children',['{app} is for people aged 18 and over. We do not knowingly collect information from children. If you believe a child has an account, contact us and we will remove it.']],
['13. Changes to this Policy',['We may update this Policy. When we make an important change we will notify you in the app. The "Last updated" date at the top shows when it was last changed.']],
['14. Contact us',['{company}','Email: {email}','Address: {address}']]
]}};

let _ac;function beep(){try{const P=prefs();if(!P.snd)return;_ac=_ac||new(window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.frequency.value=880;o.type='sine';g.gain.value=.06;o.connect(g);g.connect(_ac.destination);o.start();o.stop(_ac.currentTime+.18)}catch(e){}}

/* ============ PHOTOS ============ */
function pickFile(capture){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';if(capture)i.setAttribute('capture',capture);i.style.display='none';document.body.appendChild(i);i.onchange=()=>{res(i.files[0]||null);i.remove()};i.click()})}
function loadImg(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>res(im);im.src=r.result};r.readAsDataURL(file)})}
async function squareJpeg(file,size,q){const im=await loadImg(file),s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2,c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(im,sx,sy,s,s,0,0,size,size);return c.toDataURL('image/jpeg',q)}
async function fitJpeg(file,max,q){const im=await loadImg(file),k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function changePhoto(capture){
 const f=await pickFile(capture);if(!f)return;
 try{const big=await squareJpeg(f,320,.8),sm=await squareJpeg(f,96,.7);await db.collection('users').doc(me.uid).update({photo:big,photoS:sm});me.photo=big;me.photoS=sm;toast('Profile photo updated');pgRefresh()}catch(e){toast('Could not use that photo. Try another one.')}
}

let MYD=null,MYP=null;
async function ratingOf(uid,as){
 const s=await R_.where(as==='driver'?'driver':'pax','==',uid).get();let sum=0,n=0,trips=0;const rev=[];
 s.forEach(d=>{const r=d.data();if(r.status==='done')trips++;const v=as==='driver'?r.rating:r.paxRating;if(v>0){sum+=v;n++;const t=as==='driver'?r.ratingNote:r.paxNote;if(t)rev.push({v,t,by:as==='driver'?r.paxName:r.driverName,at:(r.created&&r.created.seconds)||0})}});
 rev.sort((a,b)=>b.at-a.at);return{avg:n?sum/n:0,n,trips,rev:rev.slice(0,8)}}
const drvStatus=u=>(u||me).dstatus&&(u||me).dstatus!=='none'?(u||me).dstatus:(((u||me).car&&(u||me).plate&&(u||me).role==='driver')?'verified':'none');

  $('#mdp').innerHTML=`<div class="vu">${avt(u.photo||u.photoS,u.name,92)}<h3>${esc(u.name||'User')} ${as==='driver'&&isVerified(u)?vbadge():''}</h3><div class="rr">${stars5(r.avg,18)}<b>${rateTxt(r)}</b></div>
  <div class="chips"><span class="chip">${ic('car',15)} ${r.trips} trip${r.trips===1?'':'s'}</span>${since?`<span class="chip">${ic('calendar',15)} Since ${since}</span>`:''}${as==='driver'&&isVerified(u)?`<span class="chip ok">${ic('shieldcheck',15)} Verified driver</span>`:''}</div>
  ${as==='driver'&&u.car?`<div class="card" style="width:100%;text-align:left"><div class="of">${carImg('ride',74)}<div class="t"><b>${esc(u.car)}</b><span class="m" style="margin:0"><span class="plate">${esc(u.plate||'')}</span></span></div></div></div>`:''}
  ${r.rev.length?`<div style="width:100%;text-align:left"><div class="sec" style="margin-top:6px">Recent comments</div>${r.rev.slice(0,3).map(x=>`<div class="rv">${stars5(x.v,12)}<p>${esc(x.t)}</p></div>`).join('')}</div>`:''}
  <button class="btn d" style="margin-top:10px" onclick="mdClose(null)">Close</button></div>`}catch(e){$('#mdp').innerHTML='<p class="m">Could not load this profile.</p><button class="btn d" onclick="mdClose(null)">Close</button>'}}

 clrMap();$('#pin').hidden=true;$('#loc').hidden=true;

 $('#top').hidden=false;$('#top').innerHTML=`<div class="tr" onclick="openSearch('pk')">${IC_PERSON}<b>${esc(here.name||'Pickup')}</b></div><div class="tr" onclick="openSearch('ds')">${IC_FLAG}<b>${esc(drop.name)} <small>~${rt?rt.mins:'?'} min</small></b></div>`;
 const t=money(price).replace('.00','');
 sh(`<button class="bk" onclick="backIdle()">${ic('chevL',24)}</button>
 <div class="rc">${carImg(rtype,118)}<div><b>${rtype==='ride'?'Ride':'City to city'}</b><br><span class="g">${ic('user',14)} 4 • ${rt.mins} min • ${rt.km.toFixed(1)} km</span><br><span class="g">Affordable fares</span></div></div>

}
async function req(){
 if(!(price>0)||!drop||!here)return;
 await fx(R_.add({pax:me.uid,paxName:me.name,paxPhone:me.phone,paxPhoto:me.photoS||null,paxRating:MYP&&MYP.n?+MYP.avg.toFixed(2):0,paxRN:MYP?MYP.n:0,pickup:{lat:here.lat,lng:here.lng,name:here.name||'Pickup'},drop,km:+rt.km.toFixed(1),mins:rt.mins,type:rtype,price,auto,note,status:'open',active:true,created:TS()}));
}
const _acc0=0;
function accept(id){const o=O[id];if(!o)return;fx(R_.doc(ride.id).update({status:'accepted',driver:o.driver,driverName:o.name,driverPhone:o.phone,driverCar:o.car,driverPlate:o.plate,driverPhoto:o.photo||null,driverRating:o.rating||0,driverRN:o.rcount||0,driverVerified:!!o.verified,price:o.price}))}
function paxView(){
 offU&&offU();offU=null;const r=ride;
 if(!r){
  $('#loc').style.bottom='';
  if(stage==='route'&&drop&&here)return routeView();
  if(stage==='pickdrop')return pickView();
  return idleView()}
 stage='route';$('#pin').hidden=true;$('#top').hidden=true;$('#loc').hidden=true;
 clrMap(['p','d','c']);
 put('p',{lat:r.pickup.lat,lng:r.pickup.lng},pickI());put('d',{lat:r.drop.lat,lng:r.drop.lng},dropI());
 if(r.status==='open'){
  if(fitted!=='o'+r.id){fitted='o'+r.id;fit([r.pickup,r.drop])}
  sh(`<div class="row"><h3><span class="pulse"></span>Finding drivers…</h3><span class="pr">${money(r.price)}</span></div>
  <p class="m">${esc(r.pickup.name)} → ${esc(r.drop.name)} · ${r.km} km${r.auto?` · <b style="color:var(--accX)">Auto-accept on</b>`:''}</p>
  <div class="row"><button class="btn d s" onclick="bump(-.5)">−$0.50</button><button class="btn s" onclick="bump(.5)">Raise fare +$0.50</button></div>
  <div id="offers"><p class="m">Waiting for driver offers…</p></div><button class="lnk" onclick="cancel()">Cancel request</button>`);
  let seen=0;
  offU=R_.doc(r.id).collection('offers').onSnapshot(s=>{
   O={};s.forEach(d=>O[d.id]=d.data());
   if(ride&&ride.auto){const best=Object.entries(O).filter(([i,o])=>+o.price<=+ride.price&&!DECL[i]).sort((a,b)=>a[1].price-b[1].price)[0];if(best&&ride.status==='open'){offU&&offU();offU=null;return accept(best[0])}}
   const a=Object.entries(O).filter(([id])=>!DECL[id]).sort((x,y)=>x[1].price-y[1].price),b=$('#offers');if(!b)return;
   if(a.length>seen)alertUser('New offer from '+a[0][1].name);seen=a.length;
   b.innerHTML=a.length?a.map(([id,o])=>`<div class="card"><div class="of"><span onclick="viewUser('${o.driver}','driver')">${avt(o.photo,o.name,52)}</span><div class="t"><b>${esc(o.name)} ${o.verified?vbadge():''}</b><span class="rr">${stars5(o.rating||0,12)}<span class="mm">${o.rcount?(+o.rating).toFixed(2)+' ('+o.rcount+')':'New'}</span></span><span class="m" style="margin:2px 0 0">${esc(o.car)} · <span class="plate">${esc(o.plate)}</span>${o.eta?` · ${o.eta} min away`:''}</span></div><span class="pr">${money(o.price)}</span></div>
   <div class="row" style="margin-bottom:0"><button class="btn d s" style="flex:1" onclick="decl('${id}')">Decline</button><button class="btn s" style="flex:2" onclick="accept('${id}')">Accept</button></div></div>`).join(''):'<p class="m">Waiting for driver offers…</p>'});
  return}
 if(r.status==='done'){clrMap();
  return sh(`<div class="vu" style="padding:0"><div class="okc">${ic('check',30)}</div><h3>You've arrived</h3><p class="m" style="text-align:center">Pay ${esc(r.driverName)} ${money(r.price)} in cash.</p>${avt(r.driverPhoto,r.driverName,64)}<p style="margin:6px 0 0"><b>How was your ride?</b></p>
  <div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button class="${RT>=n?'on':''}" onclick="setStar(${n})">${icf('star',38)}</button>`).join('')}</div>
  <textarea id="rnote" class="cin ta" maxlength="200" placeholder="Add a comment (optional)"></textarea>
  <button class="btn" style="margin-top:10px" onclick="rateSubmit()">Submit</button><button class="lnk" style="color:var(--mut)" onclick="rateSkip()">Skip</button></div>`)}
 const T={accepted:'Your driver is on the way',arrived:'Your driver has arrived',ongoing:'Enjoy your trip'};
 let sub='';
 if(r.dLoc){const dl=r.dLoc,tgt=r.status==='ongoing'?r.drop:r.pickup,k=hv(dl,tgt);sub=r.status==='ongoing'?`${k.toFixed(1)} km to destination`:r.status==='arrived'?'':`${k.toFixed(1)} km away · about ${eta(k)} min`;
  put('c',{lat:dl.lat,lng:dl.lng},carI(r.dHead));
  if(EMB&&Date.now()-embT>15000){embT=Date.now();fit([dl,tgt])}
  if(fitted!==r.status+r.id){fitted=r.status+r.id;fit([dl,tgt])}}
 sh(`<div class="row"><h3>${T[r.status]||''}</h3><span class="pr">${money(r.price)}</span></div>${sub?`<p class="m">${sub}</p>`:''}
 <div class="card"><div class="of"><span onclick="viewUser('${r.driver}','driver')">${avt(r.driverPhoto,r.driverName,56)}</span><div class="t"><b>${esc(r.driverName)} ${r.driverVerified?vbadge():''}</b><span class="rr">${stars5(r.driverRating||0,12)}<span class="mm">${r.driverRN?(+r.driverRating).toFixed(2)+' ('+r.driverRN+')':'New'}</span></span><span class="m" style="margin:2px 0 0">${esc(r.driverCar)}</span></div><span class="plate big">${esc(r.driverPlate)}</span></div></div>
 <p class="m">${esc(r.pickup.name)} → ${esc(r.drop.name)}</p>${r.note?`<p class="m">${ic('note',14)} ${esc(r.note)}</p>`:''}
 <div class="row"><a class="btn d" href="tel:${esc(r.driverPhone)}">${ic('phone',18)} Call</a><button class="btn d" onclick="shareTrip()">${ic('share',18)} Share trip</button></div>${r.status!=='ongoing'?'<button class="lnk" onclick="cancel()">Cancel ride</button>':''}`);
}
function setStar(n){RT=n;document.querySelectorAll('#stars button').forEach((b,i)=>b.classList.toggle('on',i<n))}
const rateSubmit=()=>{const u={rating:RT,active:false};const t=($('#rnote')||{}).value;if(t&&t.trim())u.ratingNote=t.trim();RT=0;fx(R_.doc(ride.id).update(u))};
const rateSkip=()=>{RT=0;fx(R_.doc(ride.id).update({rating:0,active:false}))};
async function shareTrip(){
 const r=ride;if(!r)return;const l=r.dLoc||here,link=l?`https://www.google.com/maps?q=${l.lat},${l.lng}`:'';
 const txt=`I'm on a ${APP.name} trip.\nDriver: ${r.driverName}\nCar: ${r.driverCar} (${r.driverPlate})\nFrom: ${r.pickup.name}\nTo: ${r.drop.name}${link?'\nDriver location now: '+link:''}`;
 try{if(navigator.share)await navigator.share({title:APP.name+' trip',text:txt});else{await navigator.clipboard.writeText(txt);toast('Trip details copied. Paste them to a friend.')}}catch(e){}}

/* ============ DRIVER ============ */
let lastDone=null;const DSEEN={};
function driverUI(){
 let t=0,first=1;$('#loc').hidden=false;$('#loc').style.bottom='';
 W=navigator.geolocation.watchPosition(p=>{
  const ll={lat:p.coords.latitude,lng:p.coords.longitude};let h=p.coords.heading;
  if(h==null||isNaN(h)){if(prevPos&&hv(prevPos,ll)>.005)h=brg(prevPos,ll);else h=lastHead}
  lastHead=h;prevPos=ll;here=ll;if(first){first=0;map.setCenter(ll);map.setZoom(15)}
  put('me',ll,carI(h));
  if(ride&&ride.status!=='done'&&Date.now()-t>4000){t=Date.now();fx(R_.doc(ride.id).update({dLoc:ll,dHead:Math.round(h)}))}},
  ()=>toast('Turn on location to drive with '+APP.name+'.'),{enableHighAccuracy:true});
 U.push(R_.where('driver','==',me.uid).where('active','==',true).onSnapshot(s=>{
  const old=ride;ride=s.empty?null:{id:s.docs[0].id,...s.docs[0].data()};
  if(old&&!ride){if(old.status==='done'){if(!DSEEN[old.id])lastDone=old}else alertUser('The passenger cancelled the ride.')}
  if(!old&&ride&&ride.status!=='done')alertUser('Passenger accepted your offer!');
  drvView()}));
 U.push(R_.where('driver','==',me.uid).where('status','==','done').onSnapshot(s=>{HIST=s.docs.map(d=>d.data());if(!ride&&online)drawReqs();else if(!ride&&!lastDone)drvIdle()}));
}
function drvView(){
 openU&&openU();openU=null;$('#top').hidden=true;
 clrMap(['me']);
 if(ride&&ride.status==='done'&&!DSEEN[ride.id])return drvDone(ride);
 if(!ride&&lastDone&&!DSEEN[lastDone.id])return drvDone(lastDone);
 if(!ride||ride.status==='done')return drvIdle();
 const r=ride,toP=r.status==='accepted'||r.status==='arrived',tgt=toP?r.pickup:r.drop;
 put('p',{lat:r.pickup.lat,lng:r.pickup.lng},pickI());put('d',{lat:r.drop.lat,lng:r.drop.lng},dropI());
 if(fitted!==r.status+r.id){fitted=r.status+r.id;fit(here?[here,tgt]:[tgt]);route(toP&&here?here:r.pickup,tgt).then(x=>{if(ride&&ride.id===r.id&&x.path.length>2)drawPoly(x.path)})}
 const nx={accepted:['I have arrived','arrived'],arrived:['Start trip','ongoing'],ongoing:['Complete trip','done']}[r.status];
 sh(`<div class="row"><h3>${toP?'Pick up '+esc(r.paxName):'Trip in progress'}</h3><span class="pr">${money(r.price)}</span></div>
 <div class="card"><div class="of"><span onclick="viewUser('${r.pax}','pax')">${avt(r.paxPhoto,r.paxName,52)}</span><div class="t"><b>${esc(r.paxName)}</b><span class="rr">${stars5(r.paxRating||0,12)}<span class="mm">${r.paxRN?(+r.paxRating).toFixed(2)+' ('+r.paxRN+')':'New'}</span></span></div></div></div>
 <p class="m">${esc(r.pickup.name)} → ${esc(r.drop.name)} · ${r.km} km</p>${r.note?`<p class="m">${ic('note',14)} ${esc(r.note)}</p>`:''}
 <div class="row"><a class="btn d" href="tel:${esc(r.paxPhone)}">${ic('phone',18)} Call</a><a class="btn d" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${tgt.lat},${tgt.lng}&travelmode=driving">${ic('nav',18)} Navigate</a></div>
 <button class="btn" onclick="step('${nx[1]}')">${nx[0]}</button>${toP?'<button class="lnk" onclick="dcancel()">Cancel pickup</button>':''}`);
}
function drvDone(r){
 clrMap(['me']);
 sh(`<div class="vu" style="padding:0"><div class="okc">${ic('check',30)}</div><h3>Trip completed</h3><p class="m" style="text-align:center">Collect <b>${money(r.price)}</b> in cash from ${esc(r.paxName)}.</p>${avt(r.paxPhoto,r.paxName,64)}<p style="margin:6px 0 0"><b>Rate your passenger</b></p>
 <div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button class="${RT>=n?'on':''}" onclick="setStar(${n})">${icf('star',38)}</button>`).join('')}</div>
 <textarea id="rnote" class="cin ta" maxlength="200" placeholder="Add a comment (optional)"></textarea>
 <button class="btn" style="margin-top:10px" onclick="drvRate(true)">Submit</button><button class="lnk" style="color:var(--mut)" onclick="drvRate(false)">Skip</button></div>`)}
async function drvRate(go_){
 const r=ride&&ride.status==='done'?ride:lastDone;if(!r)return;const u={};
 if(go_&&RT>0){u.paxRating=RT;const t=($('#rnote')||{}).value;if(t&&t.trim())u.paxNote=t.trim()}
 RT=0;DSEEN[r.id]=1;lastDone=null;
 if(Object.keys(u).length)await fx(R_.doc(r.id).update(u));
 drvIdle();ratingOf(me.uid,'driver').then(x=>{MYD=x}).catch(()=>{})}
function drvIdle(){
 openU&&openU();openU=null;$('#top').hidden=true;$('#pin').hidden=true;clrMap(['me']);if(here)put('me',here,carI(lastHead));
 const t0=new Date();t0.setHours(0,0,0,0);const td=HIST.filter(h=>h.created&&h.created.seconds*1000>=t0);
 sh(`<div class="row dhd"><div class="of">${avt(me.photoS||me.photo,me.name,46)}<div class="t"><b>${online?'You are online':'You are offline'}</b><span class="rr">${stars5(MYD?MYD.avg:0,12)}<span class="mm">${MYD&&MYD.n?MYD.avg.toFixed(2)+' ('+MYD.n+')':'New'}</span></span></div></div><button class="btn s ${online?'d':''}" onclick="tog()">${online?'Go offline':'Go online'}</button></div>
 <div class="row" style="gap:8px"><div class="card kp"><div class="m" style="margin:0">Today</div><b class="pr">${money(td.reduce((a,h)=>a+(+h.price||0),0))}</b></div><div class="card kp"><div class="m" style="margin:0">Trips</div><b class="pr">${td.length}</b></div></div>
 <div id="reqs">${online?'<p class="m">Looking for ride requests…</p>':'<p class="m">Go online to see passengers near you.</p>'}</div>`);
 if(!online)return;
 let seen=-1;
 openU=R_.where('status','==','open').onSnapshot(s=>{
  RQ=s.docs.map(d=>({id:d.id,...d.data()})).map(r=>({...r,d:here?hv(here,r.pickup):0})).sort((a,b)=>a.d-b.d);
  if(seen>=0&&RQ.length>seen)alertUser('New ride request nearby');seen=RQ.length;drawReqs()});
}
function drawReqs(){
 const box=$('#reqs');if(!box||(ride&&ride.status!=='done')||!online)return;if(document.activeElement&&box.contains(document.activeElement))return;
 for(const k in M)if(k[0]==='r'){M[k].setMap(null);delete M[k]}
 RQ.forEach(r=>put('r'+r.id,{lat:r.pickup.lat,lng:r.pickup.lng},pickI()));
 box.innerHTML=RQ.length?RQ.map(r=>`<div class="card"><div class="of"><span onclick="viewUser('${r.pax}','pax')">${avt(r.paxPhoto,r.paxName,50)}</span><div class="t"><b>${esc(r.paxName)}</b><span class="rr">${stars5(r.paxRating||0,12)}<span class="mm">${r.paxRN?(+r.paxRating).toFixed(2)+' ('+r.paxRN+')':'New'}</span></span></div><span class="pr">${money(r.price)}</span></div>
 <p class="m">${ic('pin',14)} ${esc(r.pickup.name)} → ${esc(r.drop.name)}<br>${r.km} km trip · ${r.d.toFixed(1)} km from you${r.auto?' · <span class="tg">AUTO-ACCEPT</span>':''}${r.type==='c2c'?' · <span class="tg">CITY TO CITY</span>':''}${r.note?'<br>'+ic('note',14)+' '+esc(r.note):''}</p>
 ${SENT[r.id]?`<p class="m"><b>Offer of ${money(SENT[r.id])} sent. Waiting for passenger…</b></p>`:`<button class="btn" onclick="offer('${r.id}',${r.price})">Accept ${money(r.price)}</button>
 <div class="pc" style="margin-top:8px"><input class="cin" id="c${r.id}" type="number" step=".5" min="1" placeholder="Your price"><button class="btn d s" style="width:auto;border-radius:12px;height:46px;font-size:15px" onclick="offer('${r.id}',+$('#c${r.id}').value)">Counter</button></div>`}</div>`).join(''):'<p class="m">No requests right now. They appear here instantly.</p>';
}
async function offer(id,p){
 if(!(p>0))return toast('Enter a price first.');
 const r=RQ.find(x=>x.id===id);
 await fx(R_.doc(id).collection('offers').doc(me.uid).set({driver:me.uid,name:me.name,phone:me.phone,car:me.car,plate:me.plate,photo:me.photoS||null,rating:MYD&&MYD.n?+MYD.avg.toFixed(2):0,rcount:MYD?MYD.n:0,verified:isVerified(),price:p,eta:r?eta(r.d):null,ts:TS()}));
 SENT[id]=p;drawReqs();
}
