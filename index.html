<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ArnDrive</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<!-- FIRESTORE RULES (paste in Firebase console > Firestore > Rules):
rules_version='2';service cloud.firestore{match /databases/{d}/documents{
 match /users/{u}{allow read:if request.auth!=null;allow write:if request.auth.uid==u;}
 match /rides/{r}{allow read:if request.auth!=null;
  allow create:if request.auth.uid==request.resource.data.pax;
  allow update:if request.auth!=null;
  match /offers/{o}{allow read:if request.auth!=null;allow write:if request.auth.uid==o;}}}}
-->
<style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:Inter,system-ui,sans-serif;color:#fff;height:100vh;height:100dvh;overflow:hidden;background:#111}
#map{position:absolute;inset:0;z-index:0;background:#1a1a1c}
#bar{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;z-index:500;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
#bar>*{pointer-events:auto}#top{flex:1}
.circ{width:46px;height:46px;border-radius:50%;border:0;background:#2a2a2c;color:#fff;font-size:20px;box-shadow:0 2px 12px #0006;cursor:pointer;flex:none}
.banner{background:#1c1c1e;border-radius:18px;padding:13px 15px;display:flex;flex-direction:column;gap:9px;font-size:15px;box-shadow:0 2px 12px #0006}
.banner small{float:right;color:#9a9a9f}
#dock{position:absolute;left:0;right:0;bottom:0;z-index:600;pointer-events:none}
#fl{display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding:0 12px 10px}#fl>*{pointer-events:auto}
#sheet{pointer-events:auto;background:#1c1c1e;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:58vh;overflow:auto;box-shadow:0 -4px 24px #0006}
#sheet:empty{display:none}
h3{font-size:20px;font-weight:800}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:10px 0}
.m,small{color:#9a9a9f;font-size:14px}.m{margin:6px 0}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:#c1f11d;color:#1a1a1a;border:0;border-radius:14px;padding:16px;font:800 17px Inter,sans-serif;cursor:pointer}
.btn.d{background:#2a2a2c;color:#fff}.btn.s{padding:10px 14px;width:auto;font-size:14px}
.lnk{background:none;border:0;color:#ff5a5a;font:600 14px Inter,sans-serif;width:100%;padding:12px;cursor:pointer}
.card{background:#2a2a2c;border-radius:16px;padding:12px;margin:8px 0}
.pr{font-weight:800;font-size:20px}
.chip{border:0;border-radius:99px;padding:9px 16px;background:#2a2a2c;color:#fff;font:600 14px Inter,sans-serif;cursor:pointer}.chip.on{background:#fff;color:#1a1a1a}.chip.w{background:#fff;color:#1a1a1a;margin-top:10px}
.promo{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#1f2540;border-radius:18px;padding:14px;width:100%;font-weight:600;font-size:15px}
.pi{font-size:50px;background:#2f4bff;border-radius:12px;padding:6px 10px}
.tabs2{display:flex;gap:10px;margin-bottom:12px}.tb{padding:10px 14px;border-radius:12px;background:#2a2a2c;font-weight:600;font-size:15px;cursor:pointer}.tb.on{background:#26307a;outline:2px solid #3b4bd8}
.srch{background:#2a2a2c;border-radius:16px;padding:18px 16px;font-size:18px;cursor:pointer;margin-bottom:6px}
.it{display:flex;gap:14px;align-items:center;padding:12px 4px;cursor:pointer}.it div{flex:1;min-width:0}.it b{display:block;font-size:16px}.it .circ{width:40px;height:40px;font-size:16px;background:#2a2a2c}
.pc{display:flex;align-items:center;gap:8px;margin:12px 0 2px}
.pc button{width:48px;height:48px;border:0;border-radius:50%;background:#3a3a3c;color:#fff;font-size:24px;font-weight:800;cursor:pointer}
.pc input{flex:1;min-width:0;text-align:center;font:800 26px Inter,sans-serif;border:0;background:none;outline:0;color:#fff}
.rc{background:#2a2a2c;border-radius:18px;padding:14px;border:1px solid #3a3a3c}
.tog{position:relative;width:52px;height:30px;flex:none}.tog input{opacity:0;position:absolute;inset:0;z-index:2;margin:0;width:100%;height:100%}.tog i{position:absolute;inset:0;background:#3a3a3c;border-radius:99px}.tog i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.tog input:checked+i{background:#4caf50}.tog input:checked+i::after{left:25px}
.cash{font-size:28px}
#cp{position:absolute;left:50%;top:36%;z-index:450;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
#pl{background:#1c1c1e;border-radius:14px;padding:9px 14px;font-size:14px;max-width:72vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 12px #0006}#pl small{color:#9a9a9f}
.pn,.mk{width:40px;height:40px;border-radius:11px;background:#fff;color:#111;font-size:23px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #0008}.pn{margin-top:6px}
.dot{width:18px;height:18px;border-radius:50%;border:3px solid #1a1a1a;box-shadow:0 0 0 2px #fff}
.car{font-size:26px;filter:drop-shadow(0 2px 3px #000)}
.st{display:flex;justify-content:center;gap:6px;margin:14px 0}.st button{font-size:34px;background:none;border:0;cursor:pointer}
#route{position:fixed;inset:0;z-index:900;background:#1c1c1e;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;overflow:auto}
.fld{display:flex;align-items:center;gap:12px;background:#2a2a2c;border-radius:14px;padding:12px 14px;margin:10px 0}.fld.on{outline:2px solid #fff}.fld>div{flex:1;min-width:0}.fld small{display:block}
.fld input{border:0;background:none;color:#fff;font:600 17px Inter,sans-serif;outline:0;width:100%;padding:0}
#dr{position:fixed;inset:0;z-index:950;background:#0008}#dr>div{width:82%;max-width:330px;height:100%;background:#1c1c1e;padding:calc(24px + env(safe-area-inset-top)) 18px;overflow:auto}
.logo{font-weight:800;font-size:30px;letter-spacing:-1px}.logo span{background:#c1f11d;color:#1a1a1a;padding:0 8px;border-radius:10px;margin-left:3px}
#auth{position:fixed;inset:0;z-index:1000;background:#1c1c1e;overflow:auto;padding:calc(30px + env(safe-area-inset-top)) 22px 30px;display:flex;flex-direction:column;gap:10px}
#auth input,#auth select{width:100%;border:0;border-radius:14px;padding:15px;font:600 16px Inter,sans-serif;background:#2a2a2c;color:#fff}
#auth .logo{font-size:44px;margin-top:20px}#auth p{font-weight:600;margin-bottom:14px;color:#9a9a9f}
#auth .btn.d{background:#c1f11d;color:#1a1a1a}#auth .lnk{color:#fff}
#err{color:#ff6b6b;font-weight:600;font-size:14px;min-height:18px}
.leaflet-container{font-family:Inter,sans-serif}
</style></head><body>
<div id="map"></div>
<div id="bar" hidden><button class="circ" id="hb" onclick="drawer()">☰</button><div id="top"></div></div>
<div id="cp" hidden><div id="pl">Pickup point</div><div class="pn">🙋</div></div>
<div id="dock"><div id="fl"></div><div id="sheet"></div></div>
<div id="route" hidden><div class="row"><h3>Enter your route</h3><button class="circ" onclick="closeRt()">✕</button></div>
<div class="fld"><span>🙋</span><div><small>From</small><b id="rf"></b></div></div>
<div class="fld on"><span>🔍</span><div><small>To</small><input id="ds" autocomplete="off" oninput="srch(this.value)"></div><button class="circ" style="width:40px;height:40px;font-size:18px" onclick="mapPick()">📍</button></div>
<div style="display:flex;gap:10px;margin:12px 0"><button class="chip on" id="t1" onclick="setTab(0)">Suggested</button><button class="chip" id="t2" onclick="setTab(1)">Saved</button></div><div id="res"></div></div>
<div id="dr" hidden></div>
<div id="auth">
 <div class="logo">Arn<span>Drive</span></div>
 <p>Name your fare. Ride anywhere in Zimbabwe.</p>
 <div id="su" hidden style="display:flex;flex-direction:column;gap:10px">
  <input id="nm" placeholder="Full name" autocomplete="name">
  <input id="ph" placeholder="Phone (e.g. 0771234567)" type="tel" autocomplete="tel">
  <select id="role" onchange="$('#dv').hidden=this.value!=='driver'"><option value="passenger">I need rides</option><option value="driver">I drive</option></select>
  <div id="dv" hidden style="display:flex;flex-direction:column;gap:10px"><input id="car" placeholder="Car (e.g. White Honda Fit)"><input id="pl" placeholder="Number plate"></div>
 </div>
 <input id="em" type="email" placeholder="Email" autocomplete="email">
 <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
 <div id="err"></div>
 <button class="btn d" id="go" onclick="go()">Sign in</button>
 <button class="lnk" id="tg" onclick="tgl()">New here? Create account</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// 1) PASTE YOUR FIREBASE WEB CONFIG HERE
firebase.initializeApp({
  apiKey: "AIzaSyCxHHRKO6D_-qVK1oqEQCKSCXkoAEuvJO4",
  authDomain: "arndrive-423b1.firebaseapp.com",
  databaseURL: "https://arndrive-423b1-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "arndrive-423b1",
  storageBucket: "arndrive-423b1.firebasestorage.app",
  messagingSenderId: "594530032327",
  appId: "1:594530032327:web:2073fe4286a9ff6728bce2"
});
const auth=firebase.auth(),db=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const $=s=>document.querySelector(s),sh=h=>{$('#sheet').innerHTML=h};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let me,ride,here,drop,km=0,mins=0,sug=0,line,R=[],O={},RQ=[],SENT={},U=[],offU,openU,W,online=false,mode='in',sg=0,tm;
const map=L.map('map',{zoomControl:false}).setView([-17.8292,31.0522],13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',maxZoom:19}).addTo(map);map.attributionControl.setPosition('topright');
const dot=c=>L.divIcon({className:'',html:`<div class="dot" style="background:${c}"></div>`,iconSize:[18,18],iconAnchor:[9,9]});
const carI=L.divIcon({className:'',html:'<div class="car">🚕</div>',iconSize:[30,30],iconAnchor:[15,15]});
const M={};
const put=(k,ll,ic)=>{if(M[k])M[k].setLatLng(ll);else M[k]=L.marker(ll,{icon:ic}).addTo(map)};
const clr=()=>{for(const k in M){M[k].remove();delete M[k]}if(line){line.remove();line=null}};
const hv=(a,b)=>{const r=Math.PI/180,x=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lng-a.lng)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};
const fit=a=>{try{map.fitBounds(a,{paddingTopLeft:[40,130],paddingBottomRight:[40,340]})}catch{}};
async function rev(ll){try{const j=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${ll.lat}&lon=${ll.lng}`)).json();return(j.display_name||'').split(',').slice(0,2).join(',')||'Dropped pin'}catch{return'Dropped pin'}}

/* ---------- AUTH ---------- */
function tgl(){mode=mode==='in'?'up':'in';$('#su').hidden=mode==='in';$('#su').style.display=mode==='in'?'none':'flex';$('#go').textContent=mode==='in'?'Sign in':'Create account';$('#tg').textContent=mode==='in'?'New here? Create account':'Have an account? Sign in';$('#err').textContent=''}
async function go(){
 const e=$('#em').value.trim(),p=$('#pw').value;$('#err').textContent='';
 try{
  if(mode==='in'){await auth.signInWithEmailAndPassword(e,p);return}
  const d={name:$('#nm').value.trim(),phone:$('#ph').value.trim(),role:$('#role').value,car:$('#car').value.trim(),plate:$('#pl').value.trim().toUpperCase(),created:TS()};
  if(!d.name||!d.phone)throw Error('Enter your name and phone number.');
  if(d.role==='driver'&&(!d.car||!d.plate))throw Error('Drivers must enter car and number plate.');
  sg=1;const c=await auth.createUserWithEmailAndPassword(e,p);
  await db.collection('users').doc(c.user.uid).set(d);me={...d,uid:c.user.uid};sg=0;boot();
 }catch(x){sg=0;$('#err').textContent=String(x.message).replace('Firebase: ','')}
}
auth.onAuthStateChanged(async u=>{
 if(sg)return;
 if(!u){clean();me=null;$('#auth').hidden=false;$('#bar').hidden=true;$('#cp').hidden=true;$('#route').hidden=true;sh('');$('#fl').innerHTML='';clr();return}
 const s=await db.collection('users').doc(u.uid).get();
 if(!s.exists){auth.signOut();return}
 me={...s.data(),uid:u.uid};boot();
});
function clean(){U.forEach(f=>f());U=[];offU&&offU();offU=null;openU&&openU();openU=null;if(W){navigator.geolocation.clearWatch(W);W=null}ride=null;online=false}
function boot(){
 clean();$('#auth').hidden=true;$('#bar').hidden=false;
 me.role==='driver'?driverUI():paxUI();
}

/* ---------- PASSENGER ---------- */
let gps,kind='ride',PL=[],tab=0,price=0,mode2='',NT='',rvT;
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'[]');localStorage.setItem(k,JSON.stringify(v))}catch{return[]}};
const mk=e=>L.divIcon({className:'',html:`<div class="mk">${e}</div>`,iconSize:[40,40],iconAnchor:[20,20]});
const fmt=n=>'$'+(n%1?(+n).toFixed(2):n);
const pickLL=()=>{const s=map.getSize();return map.containerPointToLatLng([s.x/2,s.y*.36])};
const goPin=ll=>{map.setView(ll,16,{animate:false});map.panBy([0,map.getSize().y*.14],{animate:false})};
function paxUI(){
 navigator.geolocation.getCurrentPosition(p=>{gps={lat:p.coords.latitude,lng:p.coords.longitude};if(!drop&&!ride)goPin(gps)},()=>{},{enableHighAccuracy:true});
 map.off('moveend').on('moveend',()=>{if($('#cp').hidden)return;const c=pickLL();here={lat:c.lat,lng:c.lng,name:'Pickup point'};$('#pl').innerHTML='Pickup point<br><small>Finding address…</small>';clearTimeout(rvT);rvT=setTimeout(async()=>{const n=await rev(c);if(here&&here.lat===c.lat){here.name=n;$('#pl').innerHTML='Pickup point<br><b>'+esc(n)+'</b>'}},500)});
 map.off('click').on('click',e=>{if(mode2==='pin')pin(e.latlng)});
 U.push(db.collection('rides').where('pax','==',me.uid).where('active','==',true).onSnapshot(s=>{ride=s.empty?null:{id:s.docs[0].id,...s.docs[0].data()};paxView()}));
}
const loc=()=>gps?goPin(gps):navigator.geolocation.getCurrentPosition(p=>{gps={lat:p.coords.latitude,lng:p.coords.longitude};goPin(gps)});
const setKind=k=>{kind=k;home()};
const bk=(p,i)=>`<button class="circ" onclick="event.stopPropagation();sv(${i})">${ls('saved').some(x=>x.n===p.n)?'★':'☆'}</button>`;
const items=()=>PL.map((p,i)=>`<div class="it" onclick="pickP(${i})"><span>🕓</span><div><b>${esc(p.n)}</b><small>${esc(p.s||'')}</small></div>${bk(p,i)}</div>`).join('');
function home(){
 clr();drop=null;mode2='';$('#cp').hidden=false;$('#hb').hidden=false;$('#top').innerHTML='';
 $('#fl').innerHTML=`<button class="circ" onclick="loc()">➤</button><div class="promo"><div>All our drivers and vehicles are screened and verified<br><button class="chip w" onclick="alert('Every ArnDrive driver signs up with name, phone, car and number plate before taking rides.')">Learn more</button></div><div class="pi">🚖</div></div>`;
 PL=ls('recent').slice(0,4);
 sh(`<div class="tabs2"><div class="tb ${kind==='ride'?'on':''}" onclick="setKind('ride')">🚗 Ride <small>👤4</small></div><div class="tb ${kind==='city'?'on':''}" onclick="setKind('city')">🧳 City to city</div></div>
 <div class="srch" onclick="openRt()">🔍 <b>Where to &amp; for how much?</b></div>${items()}`);
 here&&here.name!=='Pickup point'?goPin(here):map.fire('moveend');
}
function openRt(){tab=0;PL=ls('recent');$('#route').hidden=false;$('#rf').textContent=here&&here.name||'Pickup point';$('#ds').value='';rt();setTimeout(()=>$('#ds').focus(),60)}
function rt(){$('#t1').className='chip'+(tab?'':' on');$('#t2').className='chip'+(tab?' on':'');$('#res').innerHTML=PL.length?items():'<p class="m">Nothing here yet. Search above, or tap 📍 to pick on the map.</p>'}
const closeRt=()=>{$('#route').hidden=true};
const setTab=t=>{tab=t;$('#ds').value='';PL=ls(t?'saved':'recent');rt()};
function sv(i){const p=PL[i],a=ls('saved');ls('saved',a.some(x=>x.n===p.n)?a.filter(x=>x.n!==p.n):[p,...a]);if(tab)PL=ls('saved');$('#route').hidden?home():rt()}
function srch(v){clearTimeout(tm);tab=0;if(v.length<3){PL=ls('recent');return rt()}tm=setTimeout(async()=>{try{const j=await(await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=zw&limit=6&q=${encodeURIComponent(v)}`)).json();PL=j.map(r=>({n:r.display_name.split(',')[0],s:r.display_name.split(',').slice(1,3).join(','),lat:+r.lat,lng:+r.lon}));rt()}catch{}},450)}
const pickP=i=>{const p=PL[i];closeRt();setDrop(p)};
function mapPick(){closeRt();mode2='pin';$('#cp').hidden=true;$('#fl').innerHTML='';if(here)put('p',[here.lat,here.lng],mk('🙋'));sh('<h3>Tap the map to set your destination</h3><button class="lnk" onclick="home()">Cancel</button>')}
async function pin(ll){mode2='';sh('<p class="m">Finding address…</p>');setDrop({n:await rev(ll),s:'',lat:ll.lat,lng:ll.lng})}
async function setDrop(p){
 if(!here)return alert('Allow location access so we can find your pickup point.');
 drop={lat:p.lat,lng:p.lng,name:p.n};mode2='';$('#cp').hidden=true;clr();
 put('p',[here.lat,here.lng],mk('🙋'));put('d',[p.lat,p.lng],mk('🏁'));sh('<p class="m">Calculating route…</p>');
 try{const j=await(await fetch(`https://router.project-osrm.org/route/v1/driving/${here.lng},${here.lat};${p.lng},${p.lat}?overview=full&geometries=geojson`)).json(),rr=j.routes[0];
  km=rr.distance/1000;mins=Math.round(rr.duration/60);line=L.geoJSON(rr.geometry,{style:{color:'#fff',weight:5}}).addTo(map);fit(line.getBounds())}
 catch{km=hv(here,p)*1.3;mins=Math.round(km*2.5);fit([[here.lat,here.lng],[p.lat,p.lng]])}
 price=kind==='city'?Math.max(5,Math.round(km*.6)):Math.max(1.5,Math.round((1+.5*km)*2)/2);
 routeView();
}
function routeView(){
 $('#hb').hidden=true;
 $('#top').innerHTML=`<div class="banner"><div>🙋 <b>${esc(here.name)}</b></div><div>🏁 <b>${esc(drop.name)}</b> <small>~${mins} min</small></div></div>`;
 $('#fl').innerHTML='<button class="circ" style="align-self:flex-start" onclick="home()">←</button>';
 sh(`<div class="rc"><div class="row" style="margin:0"><div><b>${kind==='city'?'City to city':'Ride'}</b> ⓘ<br><small>👤 4 · ${mins} min · ${km.toFixed(1)} km</small><br><small>Affordable fares</small></div><div style="font-size:44px">🚗</div></div>
 <div class="pc"><button onclick="adj(-.5)">−</button><b style="font-size:26px">$</b><input id="pr" type="number" step=".5" min="1" value="${price}" oninput="$('#au').textContent=fmt(+this.value)"><button onclick="adj(.5)">+</button></div></div>
 <div class="row"><span>➤ Auto-accept offer of <b id="au">${fmt(price)}</b></span><label class="tog"><input type="checkbox" id="auto"><i></i></label></div>
 <div class="row"><span class="cash">💵</span><button class="btn" onclick="req()">Find drivers</button><button class="circ" onclick="note()">⚙</button></div>`);
}
const adj=d=>{const i=$('#pr');i.value=Math.max(1,+i.value+d);$('#au').textContent=fmt(+i.value)};
const note=()=>{const n=prompt('Note for the driver (gate, landmark, luggage…)',NT);if(n!==null)NT=n};
async function req(){
 const p=+$('#pr').value;if(!(p>0)||!drop||!here)return;
 ls('recent',[{n:drop.name,s:'',lat:drop.lat,lng:drop.lng},...ls('recent').filter(x=>x.n!==drop.name)].slice(0,8));
 await db.collection('rides').add({pax:me.uid,paxName:me.name,paxPhone:me.phone,pickup:{lat:here.lat,lng:here.lng,name:here.name||'Pickup'},drop,km:+km.toFixed(1),price:p,auto:$('#auto').checked,kind,note:NT,status:'open',active:true,created:TS()});NT='';
}
function paxView(){
 offU&&offU();offU=null;const r=ride;
 if(!r)return home();
 clr();$('#cp').hidden=true;$('#hb').hidden=false;$('#top').innerHTML='';$('#fl').innerHTML='';
 put('p',[r.pickup.lat,r.pickup.lng],mk('🙋'));put('d',[r.drop.lat,r.drop.lng],mk('🏁'));
 if(r.dLoc)put('c',[r.dLoc.lat,r.dLoc.lng],carI);
 fit([[r.pickup.lat,r.pickup.lng],[r.drop.lat,r.drop.lng]]);
 if(r.status==='open'){
  sh(`<div class="row"><h3>Finding drivers…</h3><span class="pr">${fmt(r.price)}</span></div>
  <p class="m">${esc(r.pickup.name)} → ${esc(r.drop.name)} · ${r.km} km${r.auto?' · Auto-accept on':''}</p>
  <div class="row"><button class="btn d s" onclick="bump(-.5)">−$0.50</button><button class="btn s" onclick="bump(.5)">Raise fare +$0.50</button></div>
  <div id="offers"><p class="m">Waiting for driver offers…</p></div><button class="lnk" onclick="cancel()">Cancel request</button>`);
  offU=db.collection('rides').doc(r.id).collection('offers').onSnapshot(s=>{
   O={};s.forEach(d=>O[d.id]=d.data());const a=Object.entries(O).sort((x,y)=>x[1].price-y[1].price);
   if(r.auto){const b=a.find(([,o])=>o.price<=r.price);if(b)return acc(b[0])}
   $('#offers').innerHTML=a.length?a.map(([id,o])=>`<div class="card"><div class="row" style="margin:0"><div><b>${esc(o.name)}</b><br><span class="m">${esc(o.car)} · ${esc(o.plate)}</span></div><span class="pr">${fmt(o.price)}</span></div><button class="btn" style="margin-top:8px" onclick="acc('${id}')">Accept</button></div>`).join(''):'<p class="m">Waiting for driver offers…</p>'});
  return;
 }
 if(r.status==='done')return sh(`<h3>You've arrived</h3><p class="m">Pay the driver ${fmt(r.price)} in cash. How was your ride?</p><div class="st">${[1,2,3,4,5].map(n=>`<button onclick="rate(${n})">⭐</button>`).join('')}</div><button class="lnk" style="color:#9a9a9f" onclick="rate(0)">Skip</button>`);
 const T={accepted:'Your driver is on the way',arrived:'Your driver has arrived',ongoing:'Enjoy your trip'};
 sh(`<div class="row"><h3>${T[r.status]||''}</h3><span class="pr">${fmt(r.price)}</span></div>
 <div class="card"><b>${esc(r.driverName)}</b><br><span class="m">${esc(r.driverCar)} · ${esc(r.driverPlate)}</span></div>
 <p class="m">${esc(r.pickup.name)} → ${esc(r.drop.name)}</p>
 <div class="row"><a class="btn d" href="tel:${esc(r.driverPhone)}">Call driver</a></div>${r.status!=='ongoing'?'<button class="lnk" onclick="cancel()">Cancel ride</button>':''}`);
}
const bump=d=>db.collection('rides').doc(ride.id).update({price:Math.max(1,+ride.price+d)});
const acc=id=>{const o=O[id];db.collection('rides').doc(ride.id).update({status:'accepted',driver:o.driver,driverName:o.name,driverPhone:o.phone,driverCar:o.car,driverPlate:o.plate,price:o.price})};
const cancel=()=>confirm('Cancel this ride?')&&db.collection('rides').doc(ride.id).update({status:'cancelled',active:false});
const rate=n=>db.collection('rides').doc(ride.id).update({rating:n,active:false});
function drawer(){const d=$('#dr');d.hidden=false;d.innerHTML=`<div><h3>${esc(me.name)}</h3><p class="m">${esc(me.phone)} · ${me.role==='driver'?'Driver':'Passenger'}</p><button class="btn d" style="margin:16px 0" onclick="hist()">Ride history</button><div id="hl"></div><button class="lnk" onclick="$('#dr').hidden=true;auth.signOut()">Sign out</button></div>`;d.onclick=e=>{if(e.target===d)d.hidden=true}}
async function hist(){const s=await db.collection('rides').where(me.role==='driver'?'driver':'pax','==',me.uid).get();const a=s.docs.map(d=>d.data()).filter(r=>r.status==='done'||r.status==='cancelled').sort((x,y)=>(y.created?.seconds||0)-(x.created?.seconds||0)).slice(0,15);$('#hl').innerHTML=a.length?a.map(r=>`<div class="card"><b>${fmt(r.price)}</b> · ${esc(r.status)}<br><span class="m">${esc(r.drop.name)}</span></div>`).join(''):'<p class="m">No rides yet.</p>'}

/* ---------- DRIVER ---------- */
function driverUI(){
 let t=0,first=1;
 W=navigator.geolocation.watchPosition(p=>{here={lat:p.coords.latitude,lng:p.coords.longitude};if(first){first=0;map.setView(here,14)}put('me',here,carI);
  if(ride&&ride.status!=='done'&&Date.now()-t>4000){t=Date.now();db.collection('rides').doc(ride.id).update({dLoc:here})}},()=>alert('Turn on location to drive with ArnDrive.'),{enableHighAccuracy:true});
 U.push(db.collection('rides').where('driver','==',me.uid).where('active','==',true).onSnapshot(s=>{ride=s.empty?null:{id:s.docs[0].id,...s.docs[0].data()};drvView()}));
}
function drvView(){
 openU&&openU();openU=null;
 for(const k in M)if(k!=='me'){M[k].remove();delete M[k]}if(line){line.remove();line=null}
 if(!ride||ride.status==='done')return drvIdle();
 const r=ride,toP=r.status==='accepted'||r.status==='arrived',tgt=toP?r.pickup:r.drop;
 put('p',[r.pickup.lat,r.pickup.lng],dot('#fff'));put('d',[r.drop.lat,r.drop.lng],dot('#c1f11d'));
 const nx={accepted:['I have arrived','arrived'],arrived:['Start trip','ongoing'],ongoing:['Complete trip','done']}[r.status];
 sh(`<div class="row"><h3>${toP?'Pick up '+esc(r.paxName):'Trip in progress'}</h3><span class="pr">$${(+r.price).toFixed(2)}</span></div>
 <p class="m">${esc(r.pickup.name)} → ${esc(r.drop.name)} · ${r.km} km</p>
 <div class="row"><a class="btn d" href="tel:${esc(r.paxPhone)}">Call</a><a class="btn d" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${tgt.lat},${tgt.lng}">Navigate</a></div>
 <button class="btn" onclick="step('${nx[1]}')">${nx[0]}</button>${toP?'<button class="lnk" onclick="dcancel()">Cancel pickup</button>':''}`);
}
const step=s=>db.collection('rides').doc(ride.id).update({status:s});
const dcancel=()=>confirm('Cancel this pickup? The request goes back to other drivers.')&&db.collection('rides').doc(ride.id).update({status:'open',driver:null,driverName:null,driverPhone:null,driverCar:null,driverPlate:null,dLoc:null});
const tog=()=>{online=!online;drvIdle()};
function drvIdle(){
 openU&&openU();openU=null;
 sh(`<div class="row"><h3>${online?'You are online':'You are offline'}</h3><button class="btn s ${online?'d':''}" onclick="tog()">${online?'Go offline':'Go online'}</button></div><div id="reqs">${online?'<p class="m">Looking for ride requests…</p>':'<p class="m">Go online to see passengers near you.</p>'}</div>`);
 if(!online)return;
 openU=db.collection('rides').where('status','==','open').onSnapshot(s=>{
  RQ=s.docs.map(d=>({id:d.id,...d.data()})).map(r=>({...r,d:here?hv(here,r.pickup):0})).sort((a,b)=>a.d-b.d);drawReqs()});
}
function drawReqs(){
 const box=$('#reqs');if(!box||(document.activeElement&&box.contains(document.activeElement)))return;
 for(const k in M)if(k[0]==='r'){M[k].remove();delete M[k]}
 RQ.forEach(r=>put('r'+r.id,[r.pickup.lat,r.pickup.lng],dot('#c1f11d')));
 box.innerHTML=RQ.length?RQ.map(r=>`<div class="card"><div class="row" style="margin:0"><b>${esc(r.paxName)}</b><span class="pr">$${(+r.price).toFixed(2)}</span></div>
 <p class="m">${esc(r.pickup.name)} → ${esc(r.drop.name)}<br>${r.km} km${r.kind==='city'?' · City to city':''} · ${r.d.toFixed(1)} km from you${r.note?'<br>📝 '+esc(r.note):''}</p>
 ${SENT[r.id]?`<p class="m"><b>Offer of $${(+SENT[r.id]).toFixed(2)} sent. Waiting for passenger…</b></p>`:`<button class="btn" onclick="offer('${r.id}',${r.price})">Accept $${(+r.price).toFixed(2)}</button>
 <div class="pc" style="margin-bottom:0"><input id="c${r.id}" type="number" step=".5" min="1" placeholder="Your price" style="background:#fff;border-radius:12px;height:46px;font-size:18px"><button class="btn d s" onclick="offer('${r.id}',+$('#c${r.id}').value)">Counter</button></div>`}</div>`).join(''):'<p class="m">No requests right now. They appear here instantly.</p>';
}
async function offer(id,price){
 if(!(price>0))return;
 await db.collection('rides').doc(id).collection('offers').doc(me.uid).set({driver:me.uid,name:me.name,phone:me.phone,car:me.car,plate:me.plate,price,ts:TS()});
 SENT[id]=price;drawReqs();
}
</script>
</body></html>
