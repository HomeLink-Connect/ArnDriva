rules_version='2';service cloud.firestore{match /databases/{d}/documents{
 match /users/{u}{allow read:if request.auth!=null;allow write:if request.auth.uid==u;}
 match /rides/{r}{allow read:if request.auth!=null;
  allow create:if request.auth.uid==request.resource.data.pax;
  allow update:if request.auth!=null&&(request.auth.uid==resource.data.pax||request.auth.uid==resource.data.driver||resource.data.status=='open');

<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{--acc:#c1f11d;--lime:var(--acc);--accT:#111;--accX:#c1f11d;--bg:#1b1b1b;--bgS:#1b1b1b;--bg0:#111;--card:#2b2b2c;--card2:#262627;--line:#3a3a3c;--line2:#2c2c2c;--tx:#fff;--mut:#9a9a9f;--fab:#2a2a2a;--top:#111;--btnd:#3a3a3c;--sel:#1f2f86;--selb:#3b4fd6;--pinbg:#fff;--pinfg:#111;--tgb:#1c2a05;--danger:#ff6b6b;--knob:#111;--swoff:#3a3a3c;--ph:#888;--authbg:#c1f11d;--authT:#111;--authI:#fff;--authIT:#111;--authB:#111;--authBT:#fff;--shadow:#0008;--ava:#444;--circ:#333}
body{font-family:Inter,system-ui,sans-serif;color:var(--tx);height:100vh;height:100dvh;overflow:hidden;background:var(--bg0)}
#map,#emb{position:absolute;inset:0;width:100%;height:100%}
#emb{border:0}
body:not(.light) #emb{filter:invert(.92) hue-rotate(180deg) contrast(.92) saturate(.8)}
body.emb #pin .ic,body.emb #pin .st,body.emb .mapbtn{display:none}
button,input,select{font-family:inherit}
svg[fill="#fff"]{fill:var(--tx)}svg[stroke="#fff"]{stroke:var(--tx)}
#top svg [fill]{fill:var(--tx)}#top svg [stroke]{stroke:var(--tx)}
#pin .ic svg [fill]{fill:var(--pinfg)}#pin .ic svg [stroke]{stroke:var(--pinfg)}
body.light svg.car{filter:drop-shadow(0 0 1px #777)}
.logo{font-weight:800;font-size:30px;letter-spacing:-1px}.logo span{background:#1a1a1a;color:#c1f11d;padding:0 8px;border-radius:10px;margin-left:3px}
#menu{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:500;width:52px;height:52px;border-radius:50%;background:var(--fab);border:0;color:var(--tx);font-size:24px;box-shadow:0 2px 12px var(--shadow)}
#loc{position:absolute;right:14px;z-index:500;width:52px;height:52px;border-radius:50%;background:var(--fab);border:0;box-shadow:0 2px 12px var(--shadow);display:flex;align-items:center;justify-content:center}
#top{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;z-index:500;background:var(--top);border-radius:20px;padding:6px 14px;box-shadow:0 2px 14px var(--shadow)}
#top .tr{display:flex;align-items:center;gap:12px;padding:11px 0;font-weight:600;font-size:16px}
#top .tr+.tr{border-top:1px solid var(--line2)}
#top .tr b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .tr small{color:var(--mut);font-weight:600}
svg.i{width:26px;height:26px;flex:none}
#pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:400;pointer-events:none;display:flex;flex-direction:column;align-items:center}
#pin .lbl{background:var(--top);border-radius:12px;padding:7px 12px;margin-bottom:8px;box-shadow:0 2px 10px var(--shadow);white-space:nowrap;max-width:76vw;overflow:hidden;text-overflow:ellipsis}
#pin small{display:block;color:var(--mut);font-size:12px;font-weight:600}#pin b{font-size:15px}
#pin .ic{width:44px;height:44px;border-radius:13px;background:var(--pinbg);display:flex;align-items:center;justify-content:center}
#pin .st{width:3px;height:14px;background:var(--pinbg)}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:600;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 14px calc(14px + env(safe-area-inset-bottom));max-height:78vh;overflow:visible;box-shadow:0 -4px 24px var(--shadow)}
#sheet:empty{display:none}
#sheet::before{content:"";position:absolute;top:8px;left:50%;width:46px;height:5px;margin-left:-23px;border-radius:9px;background:var(--line)}
#sheet .sc{max-height:calc(78vh - 40px);overflow:auto}
.bk{position:absolute;top:-62px;left:12px;width:50px;height:50px;border-radius:50%;background:var(--fab);border:0;color:var(--tx);font-size:24px;box-shadow:0 2px 12px var(--shadow)}
h3{font-size:21px;font-weight:800}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:10px 0}
.m{color:var(--mut);font-size:14px;margin:6px 0;line-height:1.35}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--acc);color:var(--accT);border:0;border-radius:16px;padding:17px;font:800 18px Inter,sans-serif;cursor:pointer}
.btn:active{opacity:.85}.btn.d{background:var(--btnd);color:var(--tx)}.btn.s{padding:11px 14px;width:auto;font-size:14px;border-radius:12px}
.lnk{background:none;border:0;color:var(--danger);font:600 15px Inter,sans-serif;width:100%;padding:14px;cursor:pointer}
.card{background:var(--card);border-radius:16px;padding:13px;margin:9px 0}
.pr{font-weight:800;font-size:20px}
.tabs{display:flex;gap:10px;margin:2px 0 12px}
.tab{flex:1;background:var(--card);border-radius:14px;padding:8px 10px;border:2px solid transparent;color:var(--tx);text-align:left;font:600 14px Inter,sans-serif;cursor:pointer}
.tab.on{background:var(--sel);border-color:var(--selb)}
.tab svg{width:62px;height:26px;display:block;margin-bottom:4px}
.tab .sub{float:right;opacity:.8}
.where{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:0;border-radius:16px;padding:17px 16px;color:var(--tx);font:800 19px Inter,sans-serif;text-align:left;cursor:pointer}
.rec{display:flex;align-items:center;gap:14px;padding:14px 4px;font-weight:600;font-size:16px;cursor:pointer}
.rec small{display:block;color:var(--mut);font-weight:600;font-size:14px}
.rec svg{width:22px;height:22px;stroke:var(--mut);fill:none;stroke-width:2;flex:none}
.rc{display:flex;align-items:center;gap:14px;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:10px}
.rc svg.car{width:84px;height:36px;flex:none}
.rc b{font-size:19px}.rc .g{color:var(--mut);font-weight:600}
.pc{display:flex;align-items:center;gap:8px}
.pc button{width:54px;height:54px;border:0;border-radius:50%;background:var(--circ);color:var(--tx);font-size:28px;font-weight:600;cursor:pointer}
.pc .amt{flex:1;text-align:center;font-weight:800;font-size:24px}
.pcw{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:8px;margin-bottom:10px}
.auto{display:flex;align-items:center;gap:12px;padding:14px 6px;font-weight:600;font-size:16px;border-top:1px solid var(--line2);margin-top:4px}
.auto span{flex:1}.auto svg.i{fill:var(--tx)}
.sw{width:62px;height:34px;border-radius:99px;background:var(--swoff);border:0;position:relative;cursor:pointer;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--knob);transition:.15s}
.sw.on{background:var(--acc)}.sw.on::after{left:32px;background:var(--accT)}
.fr{display:flex;align-items:center;gap:12px;margin-top:6px}
.cash{width:34px;height:22px;border-radius:4px;background:#59b14e;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#0d3b0a}
.opt{width:46px;height:46px;border:0;background:none;color:var(--tx);cursor:pointer}
.opt svg{width:26px;height:26px;stroke:var(--tx);fill:none;stroke-width:2}
.of{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:var(--ava);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.of .t{flex:1;min-width:0}.of .t b{display:block}
.stars{display:flex;justify-content:center;gap:6px;margin:14px 0}.stars button{font-size:36px;background:none;border:0;cursor:pointer}
.plate{display:inline-block;background:#fff;color:#111;border-radius:6px;padding:1px 8px;font-weight:800;font-size:13px;letter-spacing:1px;border:1px solid #bbb}
.f{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:0 14px;margin:8px 0}
.f input{flex:1;border:0;background:none;padding:15px 0;font:600 16px Inter,sans-serif;outline:0;min-width:0;color:var(--tx)}
.f input::placeholder,.cin::placeholder{color:var(--ph)}
.f svg{width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cin{background:var(--card);border:0;border-radius:12px;color:var(--tx);padding:12px;font:800 18px Inter,sans-serif;width:100%;outline:0}
#srch,#set{position:fixed;inset:0;background:var(--bgS);overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 30px}
#srch{z-index:900}#set{z-index:960}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hd button{background:none;border:0;color:var(--tx);font-size:28px;padding:6px 10px;cursor:pointer}
.dotb{width:12px;height:12px;border-radius:50%;background:var(--tx);flex:none}.dotl{width:12px;height:12px;border-radius:3px;background:var(--acc);flex:none}
.mapbtn{display:flex;align-items:center;gap:12px;padding:15px 4px;font-weight:700;font-size:16px;cursor:pointer;border-bottom:1px solid var(--line2)}
#dr{position:fixed;inset:0;z-index:950;background:#0009;display:flex}
#dr .p{width:82%;max-width:340px;background:var(--bgS);padding:calc(26px + env(safe-area-inset-top)) 18px 20px;overflow:auto}
#dr .p h3{margin-bottom:2px}.di{padding:16px 4px;font-weight:600;font-size:17px;border-bottom:1px solid var(--line2);cursor:pointer}
#md{position:fixed;inset:0;z-index:990;background:#000a;display:flex;align-items:flex-end}
#md .p{width:100%;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
#md .p .btn{margin-top:8px}
#toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top));transform:translateX(-50%);z-index:999;background:var(--tx);color:var(--bg0);padding:12px 18px;border-radius:99px;font-weight:700;font-size:14px;box-shadow:0 4px 18px var(--shadow);max-width:90vw;text-align:center}
.tg{background:var(--tgb);color:var(--accX);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800}
.tg.x{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger)}
/* settings */
.sec{font-weight:800;font-size:12px;color:var(--mut);letter-spacing:.9px;text-transform:uppercase;margin:22px 0 10px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.th{border:2px solid var(--line2);border-radius:16px;overflow:hidden;background:var(--card);cursor:pointer;padding:0;color:var(--tx);text-align:center;font:700 12.5px Inter,sans-serif}
.th.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.th .pv{height:62px;position:relative;display:block}
.th .pv i{position:absolute;left:8px;right:8px;bottom:0;height:30px;border-radius:10px 10px 0 0}
.th .pv b{position:absolute;left:16px;bottom:8px;width:44%;height:10px;border-radius:9px}
.th .pv u{position:absolute;right:10px;top:10px;width:16px;height:16px;border-radius:50%}
.th span.n{display:block;padding:8px 4px}
.srow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line2);font-weight:600}
.srow span{flex:1}
/* glass */
body.glass #sheet,body.glass #top,body.glass #md .p,body.glass #pin .lbl,body.glass #menu,body.glass #loc,body.glass .bk,body.glass #dr .p{-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1px solid var(--line)}
body.glass .btn.d,body.glass .pc button{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
/* auth */
#auth{position:fixed;inset:0;z-index:1000;background:var(--authbg);color:var(--authT);overflow:auto;padding:calc(30px + env(safe-area-inset-top)) 22px 30px;display:flex;flex-direction:column;gap:10px}
#auth .af{position:relative;color:var(--authIT)}
#auth .af svg.ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.6;pointer-events:none}
#auth input,#auth select{width:100%;border:0;border-radius:14px;padding:15px 15px 15px 46px;font:600 16px Inter,sans-serif;background:var(--authI);color:var(--authIT);outline:0}
#auth input::placeholder{color:currentColor;opacity:.5}
#auth .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;padding:11px;cursor:pointer;color:var(--authIT);opacity:.6;display:flex}
#auth .eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#auth input#pw{padding-right:48px}
#auth .logo{font-size:44px;margin-top:20px}#auth p{font-weight:600;margin-bottom:14px}
#auth .btn.d{background:var(--authB);color:var(--authBT)}#auth .lnk{color:var(--authT)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:#fff;color:#1f1f1f;border:0;border-radius:14px;padding:15px;font:700 16px Inter,sans-serif;cursor:pointer;box-shadow:0 2px 10px #0002}
.gbtn svg{width:22px;height:22px}
.or{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;opacity:.65;margin:4px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:currentColor;opacity:.5}
#err{color:#b00020;font-weight:600;font-size:14px;min-height:18px}
body.dk-auth #err{color:#ff8a8a}
</style></head><body>

async function rev(ll){if(EMB)return nrev(ll);try{const r=await new google.maps.Geocoder().geocode({location:ll});const f=r.results.find(x=>!/plus_code/.test(x.types.join()))||r.results[0];return(f.formatted_address||'').split(',').slice(0,2).join(',')||'Dropped pin'}catch{return nrev(ll)}}
async function route(a,b){
 if(EMB){const km=hv(a,b)*1.3;return{km,mins:Math.max(1,Math.round(km*2.5)),path:[]}}
 try{const{Route}=await google.maps.importLibrary('routes');const{routes}=await Route.computeRoutes({origin:{lat:a.lat,lng:a.lng},destination:{lat:b.lat,lng:b.lng},travelMode:'DRIVING',fields:['path','distanceMeters','durationMillis']});const r=routes[0];return{km:r.distanceMeters/1000,mins:Math.max(1,Math.round(r.durationMillis/60000)),path:r.path.map(p=>({lat:p.lat,lng:p.lng}))}}catch(e){}
 try{const j=await new google.maps.DirectionsService().route({origin:a,destination:b,travelMode:'DRIVING'});const l=j.routes[0].legs[0];return{km:l.distance.value/1000,mins:Math.max(1,Math.round(l.duration.value/60)),path:j.routes[0].overview_path.map(p=>({lat:p.lat(),lng:p.lng()}))}}catch(e){}
 const km=hv(a,b)*1.3;return{km,mins:Math.max(1,Math.round(km*2.5)),path:[{lat:a.lat,lng:a.lng},{lat:b.lat,lng:b.lng}]}}
function drawPoly(path){if(EMB)return;if(poly)poly.setMap(null);poly=new google.maps.Polyline({map,path,strokeColor:'#fff',strokeWeight:5,strokeOpacity:.95})}
function modal(title,opts,danger){return new Promise(res=>{window._mdr=res;$('#mdp').innerHTML=`<h3 style="margin-bottom:8px">${esc(title)}</h3>${opts.map((o,i)=>`<button class="btn d" onclick="mdClose(${i})" style="text-align:left">${esc(o)}</button>`).join('')}<button class="lnk" style="color:var(--mut)" onclick="mdClose(null)">Keep ride</button>`;$('#md').hidden=false})}

function paxUI(){
 locate(true);
 U.push(R_.where('pax','==',me.uid).where('active','==',true).onSnapshot(s=>{
  const old=ride;ride=s.empty?null:{id:s.docs[0].id,...s.docs[0].data()};
  if(old&&ride){
   if(old.status!==ride.status){const T={arrived:'Your driver has arrived 🚕',ongoing:'Trip started',done:"You've arrived"};T[ride.status]&&toast(T[ride.status])}
   if(old.driver&&!ride.driver&&ride.status==='open')toast('Your driver cancelled. Finding you another driver…')}
  if(old&&!ride){fitted='';if(old.status!=='done'&&old.status!=='cancelled'||old.status==='cancelled'){}}
  if(!ride&&hadRide){drop=null;rt=null;stage='idle';DECL={}}
  hadRide=!!ride;paxView()}));
}
function locate(first){
 navigator.geolocation.getCurrentPosition(async p=>{
  const ll={lat:p.coords.latitude,lng:p.coords.longitude};map.setCenter(ll);map.setZoom(16);
  if(me.role==='passenger'&&stage==='idle'&&!ride){here={...ll,name:here?.name};setPin();here.name=await rev(ll);setPin()}
  else if(me.role==='passenger'&&stage==='route'&&!ride){here={...ll};here.name=await rev(ll);doRoute()}
 },()=>{if(!first)toast('Turn on location access.')},{enableHighAccuracy:true});
}
function setPin(){const n=here?.name||'Finding you…';$('#pn').textContent=n}

 if(!me||me.role!=='passenger'||ride)return;

 if(stage==='idle'){here={...ll};$('#pn').textContent='…';here.name=await rev(ll);setPin()}
 else if(stage==='pickdrop'){window._pd=ll;$('#pn').textContent='…';const n=await rev(ll);window._pdn=n;$('#pn').textContent=n}

function paxView(){
 offU&&offU();offU=null;const r=ride;
 if(!r){
  $('#loc').style.bottom='';
  if(stage==='route'&&drop&&here)return routeView();
  if(stage==='pickdrop')return pickView();
  return idleView()}
 stage='route';$('#pin').hidden=true;$('#top').hidden=true;$('#loc').hidden=true;
 const keep=['p','d','c'];clrMap(keep);
 put('p',{lat:r.pickup.lat,lng:r.pickup.lng},pickI());put('d',{lat:r.drop.lat,lng:r.drop.lng},dropI());
 if(r.status==='open'){
  if(fitted!=='o'+r.id){fitted='o'+r.id;fit([r.pickup,r.drop])}
  sh(`<div class="row"><h3>Finding drivers…</h3><span class="pr">${money(r.price)}</span></div>
  <p class="m">${esc(r.pickup.name)} → ${esc(r.drop.name)} · ${r.km} km${r.auto?' · <b style="color:var(--accX)">Auto-accept on</b>':''}</p>

  <div id="offers"><p class="m">Waiting for driver offers…</p></div><button class="lnk" onclick="cancel()">Cancel request</button>`);
  offU=R_.doc(r.id).collection('offers').onSnapshot(s=>{
   O={};s.forEach(d=>O[d.id]=d.data());
   if(ride&&ride.auto){const best=Object.entries(O).filter(([i,o])=>+o.price<=+ride.price&&!DECL[i]).sort((a,b)=>a[1].price-b[1].price)[0];if(best&&ride.status==='open'){offU&&offU();offU=null;return acc(best[0])}}
   const a=Object.entries(O).filter(([id])=>!DECL[id]).sort((x,y)=>x[1].price-y[1].price),b=$('#offers');if(!b)return;
   b.innerHTML=a.length?a.map(([id,o])=>`<div class="card"><div class="of"><div class="av">${esc((o.name||'?')[0]).toUpperCase()}</div><div class="t"><b>${esc(o.name)}</b><span class="m" style="margin:0">${esc(o.car)} · <span class="plate">${esc(o.plate)}</span>${o.eta?'<br>'+o.eta+' min away':''}</span></div><span class="pr">${money(o.price)}</span></div>
   <div class="row" style="margin-bottom:0"><button class="btn d s" style="flex:1" onclick="decl('${id}')">Decline</button><button class="btn s" style="flex:2" onclick="acc('${id}')">Accept</button></div></div>`).join(''):'<p class="m">Waiting for driver offers…</p>'});
  return}
 if(r.status==='done'){clrMap();$('#top').hidden=true;
  return sh(`<h3>You've arrived</h3><p class="m">Pay the driver ${money(r.price)} in cash. How was your ride with ${esc(r.driverName)}?</p><div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button onclick="rate(${n})">⭐</button>`).join('')}</div><button class="lnk" style="color:var(--mut)" onclick="rate(0)">Skip</button>`)}
 const T={accepted:'Your driver is on the way',arrived:'Your driver has arrived',ongoing:'Enjoy your trip'};
 let sub='';
 if(r.dLoc){const dl=r.dLoc,tgt=r.status==='ongoing'?r.drop:r.pickup,k=hv(dl,tgt);sub=r.status==='ongoing'?`${k.toFixed(1)} km to destination`:r.status==='arrived'?'':`${k.toFixed(1)} km away · about ${eta(k)} min`;
  put('c',{lat:dl.lat,lng:dl.lng},carI(r.dHead));
  if(EMB&&Date.now()-embT>15000){embT=Date.now();fit([dl,tgt])}
  if(fitted!==r.status+r.id){fitted=r.status+r.id;fit([dl,tgt])}}
 sh(`<div class="row"><h3>${T[r.status]||''}</h3><span class="pr">${money(r.price)}</span></div>${sub?`<p class="m">${sub}</p>`:''}
 <div class="card"><div class="of"><div class="av">${esc((r.driverName||'?')[0]).toUpperCase()}</div><div class="t"><b>${esc(r.driverName)}</b><span class="m" style="margin:0">${esc(r.driverCar)}</span></div><span class="plate" style="font-size:16px;padding:3px 10px">${esc(r.driverPlate)}</span></div></div>
 <p class="m">${esc(r.pickup.name)} → ${esc(r.drop.name)}</p>${r.note?`<p class="m">📝 ${esc(r.note)}</p>`:''}
 <div class="row"><a class="btn d" href="tel:${esc(r.driverPhone)}">📞 Call driver</a></div>${r.status!=='ongoing'?'<button class="lnk" onclick="cancel()">Cancel ride</button>':''}`);
}

 <div class="fr"><div class="cash">$</div><button class="btn" onclick="req()">Find drivers</button><button class="opt" onclick="opts()">${IC_OPT}</button></div>`);
}
function backIdle(){drop=null;rt=null;stage='idle';paxView();map.setZoom(16);map.panTo(here)}
function adj(d){price=Math.max(1,price+d);const t=money(price).replace('.00','');$('#amt').textContent=t;$('#aut').textContent='Auto-accept offer of '+t}
function tAuto(){auto=!auto;$('#sw').classList.toggle('on',auto)}
async function opts(){
 $('#mdp').innerHTML=`<h3 style="margin-bottom:10px">Ride options</h3><p class="m">Comment for the driver</p><input class="cin" id="nt" maxlength="120" placeholder="e.g. I'm at the gate, wearing red" value="${esc(note)}"><p class="m">Payment: <b>Cash</b> to the driver at the end of the trip.</p><button class="btn" onclick="note=$('#nt').value.trim();mdClose(null)">Save</button>`;$('#md').hidden=false}
async function req(){
 if(!(price>0)||!drop||!here)return;
 await fx(R_.add({pax:me.uid,paxName:me.name,paxPhone:me.phone,pickup:{lat:here.lat,lng:here.lng,name:here.name||'Pickup'},drop,km:+rt.km.toFixed(1),mins:rt.mins,type:rtype,price,auto,note,status:'open',active:true,created:TS()}));
}
const bump=d=>fx(R_.doc(ride.id).update({price:Math.max(1,+ride.price+d)}));
const acc=id=>{const o=O[id];if(!o)return;fx(R_.doc(ride.id).update({status:'accepted',driver:o.driver,driverName:o.name,driverPhone:o.phone,driverCar:o.car,driverPlate:o.plate,price:o.price}))};
const decl=id=>{DECL[id]=1;paxView()};
async function cancel(){
 const r=ride;if(!r)return;
 if(r.status==='open'){if(!confirm('Cancel this request?'))return;return fx(R_.doc(r.id).update({status:'cancelled',active:false,cancelledBy:'passenger'}))}
 const i=await modal('Why are you cancelling?',['Driver is too far','Driver asked me to cancel','Changed my plans','Wrong pickup or destination','Other']);
 if(i===null)return;
 fx(R_.doc(r.id).update({status:'cancelled',active:false,cancelledBy:'passenger',reason:['Driver is too far','Driver asked me to cancel','Changed my plans','Wrong pickup or destination','Other'][i]}));toast('Ride cancelled')}
const rate=n=>fx(R_.doc(ride.id).update({rating:n,active:false}));

/* ============ DRIVER ============ */
function driverUI(){
 let t=0,first=1;$('#loc').hidden=false;$('#loc').style.bottom='';
 W=navigator.geolocation.watchPosition(p=>{
  const ll={lat:p.coords.latitude,lng:p.coords.longitude};let h=p.coords.heading;
  if(h==null||isNaN(h)){if(prevPos&&hv(prevPos,ll)>.005)h=brg(prevPos,ll);else h=lastHead}
  lastHead=h;prevPos=ll;here=ll;if(first){first=0;map.setCenter(ll);map.setZoom(15)}
  put('me',ll,carI(h));
  if(ride&&ride.status!=='done'&&Date.now()-t>4000){t=Date.now();fx(R_.doc(ride.id).update({dLoc:ll,dHead:Math.round(h)}))}},
  ()=>toast('Turn on location to drive with ArnDrive.'),{enableHighAccuracy:true});
 U.push(R_.where('driver','==',me.uid).where('active','==',true).onSnapshot(s=>{
  const old=ride;ride=s.empty?null:{id:s.docs[0].id,...s.docs[0].data()};
  if(old&&!ride&&old.status!=='done'){toast('The passenger cancelled the ride.')}
  if(!old&&ride)toast('Passenger accepted your offer! 🎉');
  drvView()}));
 U.push(R_.where('driver','==',me.uid).where('status','==','done').onSnapshot(s=>{HIST=s.docs.map(d=>d.data());if(!ride&&online)drawReqs();else if(!ride)drvIdle()}));
}
function drvView(){
 openU&&openU();openU=null;$('#top').hidden=true;$('#loc').hidden=!!ride&&false;
 clrMap(['me']);
 if(!ride||ride.status==='done')return drvIdle();
 const r=ride,toP=r.status==='accepted'||r.status==='arrived',tgt=toP?r.pickup:r.drop;
 put('p',{lat:r.pickup.lat,lng:r.pickup.lng},pickI());put('d',{lat:r.drop.lat,lng:r.drop.lng},dropI());
 if(fitted!==r.status+r.id){fitted=r.status+r.id;fit(here?[here,tgt]:[tgt]);route(toP&&here?here:r.pickup,tgt).then(x=>{if(ride&&ride.id===r.id&&x.path.length>2)drawPoly(x.path)})}
 const nx={accepted:['I have arrived','arrived'],arrived:['Start trip','ongoing'],ongoing:['Complete trip','done']}[r.status];
 sh(`<div class="row"><h3>${toP?'Pick up '+esc(r.paxName):'Trip in progress'}</h3><span class="pr">${money(r.price)}</span></div>
 <p class="m">${esc(r.pickup.name)} → ${esc(r.drop.name)} · ${r.km} km</p>${r.note?`<p class="m">📝 ${esc(r.note)}</p>`:''}
 <div class="row"><a class="btn d" href="tel:${esc(r.paxPhone)}">📞 Call</a><a class="btn d" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${tgt.lat},${tgt.lng}&travelmode=driving">🧭 Navigate</a></div>
 <button class="btn" onclick="step('${nx[1]}')">${nx[0]}</button>${toP?'<button class="lnk" onclick="dcancel()">Cancel pickup</button>':''}`);
}
const step=s=>fx(R_.doc(ride.id).update({status:s}));
async function dcancel(){
 const L=['Passenger not at pickup','Passenger asked me to cancel','Car problem','Too far / wrong location','Other'];
 const i=await modal('Why are you cancelling?',L);if(i===null)return;
 const id=ride.id;await fx(R_.doc(id).update({status:'open',driver:null,driverName:null,driverPhone:null,driverCar:null,driverPlate:null,dLoc:null,dHead:null,lastDriverCancel:L[i]}));
 fx(R_.doc(id).collection('offers').doc(me.uid).delete());SENT[id]=0;toast('Pickup cancelled')}
const tog=()=>{online=!online;drvIdle()};
function drvIdle(){
 openU&&openU();openU=null;$('#top').hidden=true;$('#pin').hidden=true;clrMap(['me']);if(here)put('me',here,carI(lastHead));
 const t0=new Date();t0.setHours(0,0,0,0);const td=HIST.filter(h=>h.created&&h.created.seconds*1000>=t0);
 sh(`<div class="row"><h3>${online?'You are online':'You are offline'}</h3><button class="btn s ${online?'d':''}" onclick="tog()">${online?'Go offline':'Go online'}</button></div>
 <div class="row" style="gap:8px"><div class="card" style="flex:1;margin:0;text-align:center"><div class="m" style="margin:0">Today</div><b class="pr">${money(td.reduce((a,h)=>a+(+h.price||0),0))}</b></div><div class="card" style="flex:1;margin:0;text-align:center"><div class="m" style="margin:0">Trips</div><b class="pr">${td.length}</b></div></div>
 <div id="reqs">${online?'<p class="m">Looking for ride requests…</p>':'<p class="m">Go online to see passengers near you.</p>'}</div>`);
 if(!online)return;
 openU=R_.where('status','==','open').onSnapshot(s=>{
  RQ=s.docs.map(d=>({id:d.id,...d.data()})).map(r=>({...r,d:here?hv(here,r.pickup):0})).sort((a,b)=>a.d-b.d);drawReqs()});
}
function drawReqs(){
 const box=$('#reqs');if(!box||ride||!online)return;if(document.activeElement&&box.contains(document.activeElement))return;
 for(const k in M)if(k[0]==='r'){M[k].setMap(null);delete M[k]}
 RQ.forEach(r=>put('r'+r.id,{lat:r.pickup.lat,lng:r.pickup.lng},pickI()));
 box.innerHTML=RQ.length?RQ.map(r=>`<div class="card"><div class="row" style="margin:0"><b>${esc(r.paxName)}</b><span class="pr">${money(r.price)}</span></div>
 <p class="m">${esc(r.pickup.name)} → ${esc(r.drop.name)}<br>${r.km} km trip · ${r.d.toFixed(1)} km from you${r.auto?' · <span class="tg">AUTO-ACCEPT</span>':''}${r.type==='c2c'?' · <span class="tg">CITY TO CITY</span>':''}${r.note?'<br>📝 '+esc(r.note):''}</p>
 ${SENT[r.id]?`<p class="m"><b>Offer of ${money(SENT[r.id])} sent. Waiting for passenger…</b></p>`:`<button class="btn" onclick="offer('${r.id}',${r.price})">Accept ${money(r.price)}</button>
 <div class="pc" style="margin-top:8px"><input class="cin" id="c${r.id}" type="number" step=".5" min="1" placeholder="Your price"><button class="btn d s" style="width:auto;border-radius:12px;height:46px;font-size:15px" onclick="offer('${r.id}',+$('#c${r.id}').value)">Counter</button></div>`}</div>`).join(''):'<p class="m">No requests right now. They appear here instantly.</p>';
}
async function offer(id,p){
 if(!(p>0))return toast('Enter a price first.');
 const r=RQ.find(x=>x.id===id);
 await fx(R_.doc(id).collection('offers').doc(me.uid).set({driver:me.uid,name:me.name,phone:me.phone,car:me.car,plate:me.plate,price:p,eta:r?eta(r.d):null,ts:TS()}));
 SENT[id]=p;drawReqs();
}
applyTheme(lsG('ad_theme')||'dark');
</script>
</body></html>
